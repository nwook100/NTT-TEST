<title>돗자리 단속반</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap">
<style>
/* ──────────────────────────────────────────────────────────────
   돗자리 단속반 v2
   화면: 타이틀 → 스테이지 선택 → (첫 판 튜토리얼) → 브리핑 → 3·2·1 → 인게임 → 결과
   그래픽: CSS + 인라인 SVG 스프라이트 + Canvas 불꽃 (외부 이미지 없음)
   ────────────────────────────────────────────────────────────── */
:root {
  --night: #121833;
  --grass: #1d3a2b;
  --grass-line: #27503a;
  --lantern: #ffb347;
  --lantern-red: #e8483b;
  --lantern-red-deep: #9b2a20;
  --mat-hog: #3d7bd9;
  --mat-hog-deep: #2a5cae;
  --mat-family: #d9a441;
  --mat-family-deep: #a8452f;
  --paper: #f3ecdc;
  --paper-ink: #3a2a12;
  --ink: #ece8f4;
  --muted: #9aa3c0;
  --ok: #5fd38d;
  --font-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: dark;
}
/* B-1 수정: 작성자 display 규칙이 UA [hidden]을 덮지 못하게 전역으로 고정 */
[hidden] { display: none !important; }

html { height: 100%; }
body {
  margin: 0; min-height: 100%;
  background: var(--night);
  background-image: radial-gradient(circle at 15% -10%, rgba(255,179,71,.18), transparent 40%),
                    radial-gradient(circle at 90% 0%, rgba(232,72,59,.14), transparent 35%);
  color: var(--ink);
  font-family: var(--font-body);
  padding: 12px 16px 20px;
  box-sizing: border-box;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  overflow-x: hidden;
  word-break: keep-all; /* B-7: 한글 단어 중간 줄바꿈 방지 */
}
*, *::before, *::after { box-sizing: inherit; }
button { font: inherit; color: inherit; }

#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
/* .app 에 z-index 를 주면 스택 컨텍스트가 생겨 튜토리얼 스포트라이트(.spot)가 고정 오버레이 위로 못 올라오므로 auto 로 둔다 */
.app { position: relative; max-width: 480px; margin: 0 auto; }

section[data-screen] { display: none; flex-direction: column; gap: 12px; position: relative; }
section[data-screen].on { display: flex; animation: screenIn .18s ease-out; }
@keyframes screenIn { from { opacity: 0; transform: translateY(8px); } }

/* ── 공용 ── */
.lanterns { display: flex; justify-content: space-between; height: 22px; position: relative; }
.lanterns::before { content: ""; position: absolute; left: 0; right: 0; top: 4px; border-top: 1px dashed rgba(255,179,71,.4); }
.lanterns span { width: 12px; height: 16px; margin-top: 4px; border-radius: 6px; background: var(--lantern); box-shadow: 0 0 12px var(--lantern); animation: sway 3s ease-in-out infinite; }
.lanterns span:nth-child(even) { background: var(--lantern-red); box-shadow: 0 0 12px var(--lantern-red); animation-delay: -1.5s; }
@keyframes sway { 50% { transform: rotate(8deg); } }

h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(34px, 10vw, 52px); line-height: 1; margin: 0; letter-spacing: .02em; text-align: center; }
h1 em { font-style: normal; color: var(--lantern); }
h2 { font-family: var(--font-display); font-weight: 400; margin: 0; }
.muted { color: var(--muted); }
.center { text-align: center; }
.ico { width: 1em; height: 1em; display: inline-block; vertical-align: -.15em; fill: currentColor; flex: none; }

.btn { display: block; width: 100%; max-width: 320px; margin: 0 auto; min-height: 56px; font-family: var(--font-display); font-size: 20px; padding: 10px 26px; border: 0; border-radius: 999px; background: var(--lantern-red); color: #fff; cursor: pointer; box-shadow: 0 4px 0 var(--lantern-red-deep); touch-action: manipulation; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--lantern-red-deep); }
.btn:focus-visible { outline: 3px solid var(--lantern); outline-offset: 3px; }
.btn.sec { background: rgba(255,255,255,.1); box-shadow: 0 4px 0 rgba(0,0,0,.35); min-height: 48px; font-size: 18px; }
.btn.sec:active { box-shadow: 0 1px 0 rgba(0,0,0,.35); }
.btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }
.btn-text { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 12px; min-height: 44px; cursor: pointer; font-size: 15px; }
.btn-text.danger { color: var(--lantern-red); }
.btn-text:focus-visible { outline: 3px solid var(--lantern); border-radius: 8px; }
.chips { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); cursor: pointer; font-size: 14px; touch-action: manipulation; }
.chip[aria-pressed="false"] { color: var(--muted); }
.chip .ico { width: 18px; height: 18px; }
.chip:focus-visible { outline: 3px solid var(--lantern); }

/* ── 타이틀 ── */
.hero { display: flex; gap: 14px; justify-content: center; align-items: flex-end; margin: 6px 0; }
.hero .cell { width: clamp(90px, 26vw, 120px); pointer-events: none; }
.hero .mat { animation: none; }
.hero .cell::after { content: attr(data-cap); position: absolute; left: 0; right: 0; bottom: -22px; text-align: center; font-size: 12px; color: var(--muted); }
.title-p { text-align: center; margin: 20px 0 8px; font-size: 15px; line-height: 1.6; }
.record { text-align: center; font-size: 13px; color: var(--muted); margin: 0; }

/* ── 스테이지 선택 ── */
.topbar { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; min-height: 56px; }
.topbar h2 { text-align: center; font-size: 22px; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.08); display: grid; place-items: center; cursor: pointer; touch-action: manipulation; }
.icon-btn .ico { width: 20px; height: 20px; }
.icon-btn:focus-visible { outline: 3px solid var(--lantern); }
.cards { display: flex; flex-direction: column; gap: 12px; }
.card { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; text-align: left; width: 100%; min-height: 88px; padding: 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.05); cursor: pointer; touch-action: manipulation; }
.card:focus-visible { outline: 3px solid var(--lantern); }
.card .num { font-family: var(--font-display); font-size: 30px; color: var(--lantern); text-align: center; }
.card b { display: block; font-size: 18px; }
.card small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.card .new { color: var(--ok); font-weight: bold; }
.card .stars { display: flex; gap: 2px; }
.card.locked { filter: saturate(.4); opacity: .75; }
.card.locked .num { color: var(--muted); }
.card.locked .lock { display: flex; gap: 4px; align-items: center; color: var(--muted); font-size: 13px; }
.card.deny { animation: deny .3s; }
@keyframes deny { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.star { width: 18px; height: 18px; fill: rgba(255,255,255,.18); }
.star.on { fill: var(--lantern); }

/* ── 인게임 HUD ── */
.hud { display: grid; grid-template-columns: 44px 1fr 1fr auto; gap: 8px; align-items: center; min-height: 48px; }
.hud .stat { text-align: center; }
.hud small { display: block; font-size: 11px; letter-spacing: .08em; color: var(--muted); }
.hud b { font-family: var(--font-display); font-weight: 400; font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.1; display: inline-block; }
.hud .time.low b { color: var(--lantern-red); animation: tick 1s steps(1) infinite; }
@keyframes tick { 0% { transform: scale(1.15); } 50% { transform: scale(1); } }
.combo { min-width: 60px; height: 34px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 3px; padding: 0 10px; border: 2px solid rgba(255,255,255,.2); font-family: var(--font-display); font-size: 18px; color: var(--muted); opacity: .6; transition: transform .15s; }
.combo .ico { width: 14px; height: 14px; display: none; fill: #fff; }
.combo.c2 { opacity: 1; color: #fff; background: var(--lantern); border-color: transparent; }
.combo.c2 .f1 { display: inline-block; }
.combo.c4 { opacity: 1; color: #fff; background: var(--lantern); border-color: transparent; }
.combo.c4 .f1, .combo.c4 .f2 { display: inline-block; }
.combo.c5 { opacity: 1; color: #fff; background: var(--lantern-red); border-color: transparent; box-shadow: 0 0 12px var(--lantern-red); }
.combo.c5 .f1, .combo.c5 .f2 { display: inline-block; }
.combo.bump { transform: scale(1.3); }
.combo-break { position: absolute; right: 0; top: 50px; font-size: 12px; color: var(--muted); animation: fadeUp .6s forwards; }

.meter-row { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; font-size: 12px; position: relative; min-height: 28px; }
.meter-row .lab { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.meter-row .lab .ico { width: 16px; height: 16px; }
.meter-row .lab .warn { display: none; color: var(--lantern-red); font-weight: bold; }
.meter { height: 16px; border-radius: 8px; background: rgba(255,255,255,.08); overflow: hidden; position: relative; transition: height .2s; }
.meter i { display: block; height: 100%; width: 0; background: var(--lantern); transition: width .2s; }
.meter::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 24.5%, rgba(0,0,0,.35) 24.5% 25%); pointer-events: none; }
.pct { font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; }
.queue { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); white-space: nowrap; }
.queue .ico { width: 16px; height: 16px; }
.meter-row.warn .meter { height: 20px; }
.meter-row.warn .meter i { background: var(--lantern-red); background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.25) 0 6px, transparent 6px 12px); animation: pulse 1.2s ease-in-out infinite; }
.meter-row.warn .lab .warn { display: inline; }
.meter-row.warn .pct { font-weight: bold; color: var(--lantern-red); }
.meter-row.crit .meter i { animation: pulse .6s ease-in-out infinite, slide .5s linear infinite; background-size: auto, 17px 17px; }
@keyframes pulse { 50% { filter: brightness(1.35); } }
@keyframes slide { to { background-position: 0 0, 17px 0; } }

/* ── 잔디밭 격자 ── */
.field-wrap { position: relative; }
.field {
  position: relative; margin: 0 auto;
  display: grid; grid-template-columns: repeat(var(--cols, 4), var(--cell, 78px)); gap: 8px;
  padding: 10px; border-radius: 14px; width: max-content; max-width: 100%;
  background: var(--grass);
  background-image: repeating-linear-gradient(90deg, transparent 0 18px, var(--grass-line) 18px 19px);
}
.field::after { content: ""; position: absolute; inset: 0; border-radius: 14px; pointer-events: none; opacity: 0;
  box-shadow: inset 0 0 0 2px var(--lantern-red), inset 0 0 40px 8px rgba(232,72,59,.45); }
.field.alarm::after { animation: fade .45s ease-out; }
.field.warn::after { opacity: .6; }
.field.crit::after { opacity: 1; animation: pulse .6s ease-in-out infinite; }
@keyframes fade { from { opacity: 1; } to { opacity: 0; } }
.field.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

.cell { width: var(--cell, 78px); aspect-ratio: 1 / 1; position: relative; border: 0; padding: 0; background: transparent; cursor: pointer; border-radius: 8px; touch-action: manipulation; transition: transform .08s; }
.cell.pressed { transform: scale(.94); }
.cell.pressed.warnpress::before { content: ""; position: absolute; inset: 0; border-radius: 8px; box-shadow: 0 0 0 3px var(--lantern-red); z-index: 3; pointer-events: none; }
.cell:focus-visible { outline: 3px solid var(--lantern); outline-offset: 2px; }
.cell.shade::after { content: ""; position: absolute; inset: 0; border-radius: 8px; background: rgba(10,10,30,.55); pointer-events: none; z-index: 1; }

.mat { position: absolute; inset: 6%; border-radius: 4px; display: grid; place-items: center; align-content: center; animation: drop .25s ease-out; overflow: visible; }
@keyframes drop { from { transform: scale(.6); opacity: 0; } }
/* 돗자리 8종 — 선점/관람객 구분 없이 무작위. 색·무늬는 정답 힌트가 아니다. (판단 근거는 사람 유무뿐) */
.mat { box-shadow: inset 0 0 0 2px rgba(255,255,255,.16), 0 3px 0 rgba(0,0,0,.35); }
.mat.p0 { background-color: #3d7bd9; background-image: linear-gradient(135deg, rgba(255,255,255,.22), transparent 38%), linear-gradient(90deg, rgba(255,255,255,.26) 50%, transparent 0), linear-gradient(0deg, rgba(255,255,255,.26) 50%, transparent 0); background-size: 100% 100%, 14px 14px, 14px 14px; }   /* 파랑 체크 */
.mat.p1 { background-color: #d9433b; background-image: linear-gradient(135deg, rgba(255,255,255,.18), transparent 38%), linear-gradient(90deg, rgba(255,255,255,.28) 50%, transparent 0), linear-gradient(0deg, rgba(255,255,255,.28) 50%, transparent 0); background-size: 100% 100%, 12px 12px, 12px 12px; }   /* 빨강 체크 */
.mat.p2 { background-color: #2f9e6e; background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.35) 0 5px, transparent 5px 12px); }   /* 초록 줄무늬 */
.mat.p3 { background-color: #7c5cc4; background-image: radial-gradient(circle at 8px 8px, #f7d6ff 0 2.5px, #ffb3e6 2.5px 4.5px, transparent 5px), radial-gradient(circle at 20px 18px, #ffe08a 0 2px, transparent 2.5px); background-size: 24px 24px, 24px 24px; }   /* 보라 꽃무늬 */
.mat.p4 { background-color: #c9ced8; background-image: linear-gradient(115deg, rgba(255,255,255,.8) 0 12%, transparent 12% 30%, rgba(255,255,255,.6) 30% 36%, transparent 36% 60%, rgba(255,255,255,.7) 60% 66%, transparent 66%), repeating-linear-gradient(90deg, rgba(0,0,0,.08) 0 1px, transparent 1px 8px); box-shadow: inset 0 0 0 2px rgba(255,255,255,.5), 0 3px 0 rgba(0,0,0,.35); }   /* 은박 */
.mat.p5 { background-color: #d9a441; background-image: radial-gradient(120% 80% at 20% 0%, rgba(255,214,140,.35), transparent 60%), repeating-linear-gradient(0deg, rgba(90,50,10,.22) 0 1px, transparent 1px 11px), repeating-linear-gradient(90deg, rgba(0,0,0,.10) 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 3px #a8452f, 0 3px 0 rgba(0,0,0,.35); }   /* 왕골 */
.mat.p6 { background-color: #f08fb6; background-image: radial-gradient(circle, #fff 0 3px, transparent 3.5px); background-size: 14px 14px; background-position: 0 0; }   /* 분홍 땡땡이 */
.mat.p7 { background-color: #6b7280; background-image: radial-gradient(circle at 6px 6px, rgba(0,0,0,.28) 0 2px, transparent 2.5px), radial-gradient(circle at 12px 12px, rgba(255,255,255,.12) 0 1.5px, transparent 2px); background-size: 12px 12px, 12px 12px; box-shadow: inset 0 0 0 3px #4b5160, 0 3px 0 rgba(0,0,0,.35); }   /* 회색 캠핑매트 */
/* 황금 돗자리 */
.mat.gold { background-color: #f6c431; background-image: linear-gradient(115deg, rgba(255,255,255,.85) 0 10%, transparent 10% 40%, rgba(255,255,255,.6) 40% 46%, transparent 46%), repeating-linear-gradient(45deg, rgba(180,120,0,.25) 0 4px, transparent 4px 10px); box-shadow: inset 0 0 0 3px #b8860b, 0 0 18px 4px rgba(246,196,49,.7); animation: drop .25s ease-out, goldGlow .8s ease-in-out infinite alternate; }
@keyframes goldGlow { to { box-shadow: inset 0 0 0 3px #b8860b, 0 0 28px 8px rgba(255,230,120,.95); } }
.mat.gold .tag { background: #fff8d0; font-weight: bold; }
/* 곧 돌아오는 주인: 2초 전 예고 (걸어오는 실루엣 + 배지) */
.walker { position: absolute; left: -22%; bottom: 0; width: 46%; z-index: 3; pointer-events: none; opacity: .85; animation: walk 2s linear forwards; }
@keyframes walk { 0% { transform: translateX(0) rotate(-6deg); } 25% { transform: translateX(10%) rotate(6deg); } 50% { transform: translateX(20%) rotate(-6deg); } 75% { transform: translateX(30%) rotate(6deg); } 100% { transform: translateX(40%) rotate(0); } }
.soon { position: absolute; top: -6px; right: -4px; z-index: 3; background: var(--lantern-red); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 999px; pointer-events: none; animation: blinkSoon .5s steps(2) infinite; }
@keyframes blinkSoon { 50% { opacity: .35; } }
/* 강아지 */
.dog { position: absolute; width: calc(var(--cell) * .7); height: calc(var(--cell) * .7); z-index: 6; pointer-events: none; animation: dogBounce .25s ease-in-out infinite alternate; }
@keyframes dogBounce { to { transform: translateY(-14%) rotate(-6deg); } }
/* 돌풍: 쪽지 돗자리 날아감 */
.mat.blown { animation: blown .7s ease-in forwards !important; transform-origin: 50% 50%; }
@keyframes blown { 40% { transform: translate(30%, -30%) rotate(25deg); opacity: 1; } 100% { transform: translate(220%, -160%) rotate(140deg); opacity: 0; } }
.windwarn { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); padding: 10px 18px; border-radius: 12px; background: rgba(14,18,34,.85); border: 2px solid #7fd6ff; color: #7fd6ff; font-family: var(--font-display); font-size: 24px; white-space: nowrap; pointer-events: none; z-index: 5; animation: windwarn 3s steps(1) forwards; }
@keyframes windwarn { 0%, 30%, 60% { opacity: 1; } 15%, 45%, 75% { opacity: .3; } 100% { opacity: 0; } }
/* 피버 타임: 화면 가장자리 무지개 */
#feverRing { position: fixed; inset: 0; z-index: 20; pointer-events: none; border: 7px solid transparent; border-image: conic-gradient(#ff5e5e, #ffb347, #ffe66d, #5fd38d, #7fd6ff, #c08cff, #ff8fc7, #ff5e5e) 1; animation: hue 1.2s linear infinite; }
@keyframes hue { to { filter: hue-rotate(360deg); } }
.fever-tag { position: absolute; left: 50%; top: -14px; transform: translateX(-50%); background: linear-gradient(90deg, #ff5e5e, #ffb347, #5fd38d, #7fd6ff, #c08cff); color: #fff; font-family: var(--font-display); font-size: 14px; padding: 3px 12px; border-radius: 999px; z-index: 5; white-space: nowrap; text-shadow: 0 1px 2px #000; }
/* 흰 플래시 + 화면 흔들림 */
#flash { position: fixed; inset: 0; z-index: 50; pointer-events: none; background: #fff; opacity: 0; }
#flash.on { animation: flash .12s ease-out; }
@keyframes flash { from { opacity: .55; } to { opacity: 0; } }
.app.sh1 { animation: sh1 .22s; } .app.sh2 { animation: sh2 .26s; } .app.sh3 { animation: sh3 .3s; }
@keyframes sh1 { 25% { transform: translate(3px, -2px); } 50% { transform: translate(-3px, 2px); } 75% { transform: translate(2px, 1px); } }
@keyframes sh2 { 20% { transform: translate(6px, -4px) rotate(.3deg); } 40% { transform: translate(-6px, 4px); } 60% { transform: translate(5px, 2px) rotate(-.3deg); } 80% { transform: translate(-3px, -2px); } }
@keyframes sh3 { 15% { transform: translate(11px, -7px) rotate(.6deg); } 30% { transform: translate(-11px, 7px) rotate(-.6deg); } 45% { transform: translate(9px, 4px); } 60% { transform: translate(-8px, -5px) rotate(.4deg); } 80% { transform: translate(4px, 2px); } }
.spr { width: 44%; height: auto; aspect-ratio: 1; display: block; flex: none; }
.mat .items { display: flex; align-items: flex-end; justify-content: center; width: 100%; }
.mat .items .spr + .spr { margin-left: -8%; }
.mat.family .items .spr { width: 50%; }
.who-a { --shirt: #e8735a; --pants: #3b3f5c; --skin: #f2c7a0; --hair: #2b2233; }
.who-b { --shirt: #7c6cf0; --pants: #2e4a6b; --skin: #d9a57c; --hair: #6b3f24; }
.who-c { --shirt: #4fb3a0; --pants: #5a4a3a; --skin: #f0c8a8; --hair: #d8d8e0; }
.who-kid { transform: scale(.78); transform-origin: 50% 100%; }
.ghost { opacity: .25; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -58%); width: 50%; pointer-events: none; }

/* B-6: 쪽지를 돗자리 안쪽 상단에, 11px */
.mat .tag { position: absolute; top: 4px; left: 50%; transform: translateX(-50%) rotate(-4deg); max-width: 108%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  background: #fff3b0; color: var(--paper-ink); font-size: 11px; line-height: 1.2; padding: 2px 4px; letter-spacing: -.02em; border-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,.4);
  background-image: linear-gradient(225deg, #e6d27a 6px, transparent 6px); z-index: 1; }
.field.cols5 .mat .tag { font-size: 10px; padding: 1px 4px; }
.mat .tag.big { top: 50%; transform: translate(-50%, -50%) rotate(-6deg); font-size: 12px; padding: 6px 8px; max-width: 86%; white-space: normal; text-align: center; box-shadow: 0 2px 4px rgba(0,0,0,.45);
  background-image: linear-gradient(225deg, #e6d27a 8px, transparent 8px); animation: flutter 2s ease-in-out infinite; }

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const fmt = (n) => n.toLocaleString("ko-KR");
  const spr = (id, cls = "") => `<svg class="spr ${cls}" aria-hidden="true"><use href="#spr-${id}"/></svg>`;

  // ═══════════════════════════════ 저장소 ═══════════════════════════════
  const store = {
    get(k, def) { try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };

  // ═══════════════════════════════ 사운드 (docs/sound.md) ═══════════════════════════════
  const SFX = {
    ctx: null, master: null, muted: false, _noiseBuf: null,
    bgm: { on: false, timer: 0, nextTime: 0, step: 0, gain: null },
    // 규칙 1) AudioContext 생성/resume 은 사용자 제스처 핸들러 안에서만.
    // 규칙 2) iOS 는 같은 제스처 안에서 무음 버퍼 1샘플 재생.
    // 규칙 3) visibilitychange 와 이후 제스처에서 resume 재시도.
    init() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!this.ctx) {
        this.ctx = new AC({ latencyHint: "interactive" });
        this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : 1;
        this.master.connect(this.ctx.destination);
      }
      if (this.ctx.state !== "running") {
        this.ctx.resume().catch(() => {});
        try {
          const b = this.ctx.createBuffer(1, 1, 22050);
          const s = this.ctx.createBufferSource();
          s.buffer = b; s.connect(this.ctx.destination); s.start(0);
        } catch (e) {}
      }
      return this.ctx;
    },
    installUnlock(target = document) {
      const onGesture = () => { this.init(); };
      ["pointerdown", "touchend", "keydown"].forEach((ev) => target.addEventListener(ev, onGesture, { passive: true, capture: true }));
      document.addEventListener("visibilitychange", () => {
        if (this.ctx && document.visibilityState === "visible" && this.ctx.state !== "running") this.ctx.resume().catch(() => {});
      });
      this.loadMute();
    },
    setMuted(m) {
      this.muted = !!m;
      try { localStorage.setItem("seathog-muted", this.muted ? "1" : "0"); } catch (e) {}
      if (this.master) {
        const g = this.master.gain, t = this.ctx.currentTime;
        g.cancelScheduledValues(t); g.setValueAtTime(g.value, t);
        g.linearRampToValueAtTime(this.muted ? 0 : 1, t + 0.05);
      }
      return this.muted;
    },
    toggleMute() { return this.setMuted(!this.muted); },
    loadMute() { try { this.muted = localStorage.getItem("seathog-muted") === "1"; } catch (e) {} return this.muted; },
    _c() { return this.ctx && this.ctx.state !== "closed" ? this.ctx : null; },
    _tone(freq, dur, o = {}) {
      const c = this._c(); if (!c) return;
      const t0 = c.currentTime + (o.delay || 0);
      const osc = c.createOscillator(), g = c.createGain();
      osc.type = o.type || "sine";
      osc.frequency.setValueAtTime(freq, t0);
      if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(o.gain ?? 0.15, t0 + (o.attack || 0.004));
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g).connect(o.out || this.master);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    },
    _noise(dur, o = {}) {
      const c = this._c(); if (!c) return;
      if (!this._noiseBuf) {
        const n = c.sampleRate, buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
        this._noiseBuf = buf;
      }
      const t0 = c.currentTime + (o.delay || 0);
      const src = c.createBufferSource(); src.buffer = this._noiseBuf; src.loop = true;
      const f = c.createBiquadFilter(); f.type = o.filter || "bandpass"; f.Q.value = o.q || 1;
      f.frequency.setValueAtTime(o.freq || 2000, t0);
      if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(o.gain ?? 0.2, t0 + (o.attack || 0.003));
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(f).connect(g).connect(o.out || this.master);
      src.start(t0); src.stop(t0 + dur + 0.02);
    },
    _metal(base, dur, o = {}) {
      const c = this._c(); if (!c) return;
      const t0 = c.currentTime + (o.delay || 0);
      const ratios = [1, 1.48, 2.07, 2.93], gains = [1, 0.55, 0.35, 0.2];
      const out = c.createGain(); out.gain.value = o.gain ?? 0.18; out.connect(o.out || this.master);
      ratios.forEach((r, i) => {
        const osc = c.createOscillator(), g = c.createGain();
        osc.type = i === 0 ? "triangle" : "sine";
        osc.frequency.setValueAtTime(base * r, t0);
        osc.frequency.exponentialRampToValueAtTime(base * r * 0.985, t0 + dur);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.linearRampToValueAtTime(gains[i], t0 + 0.002);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur * (1 - i * 0.15));

        osc.start(t0); osc.stop(t0 + dur + 0.02);

      this._noise(0.03, { filter: "highpass", freq: 4000, gain: (o.gain ?? 0.18) * 0.8, delay: o.delay || 0, out: o.out });
    },
    // v3: 꽹과리 볼륨·길이 키움(0.16/0.22s → 0.28/0.4s), x5는 징(낮고 긴 금속음) + 더블 스트로크
    clear(combo = 1) {
      const k = Math.max(1, Math.min(5, combo)) - 1;
      const base = [660, 740, 880, 990, 1175][k];
      this._metal(base, 0.4 + k * 0.05, { gain: 0.28 + k * 0.02 });
      this._noise(0.05, { filter: "highpass", freq: 3500, gain: 0.12 });
      if (k >= 2) this._tone(base * 2, 0.18, { type: "sine", gain: 0.08, delay: 0.03 });
      if (k === 4) { this._metal(196, 1.4, { gain: 0.3 }); this._metal(base * 1.5, 0.35, { delay: 0.09, gain: 0.16 }); }
    },
    gong() { this._metal(165, 1.8, { gain: 0.34 }); this._tone(82, 0.9, { type: "sine", gain: 0.2, to: 60 }); },
    gold() { [1047, 1319, 1568, 2093].forEach((f, i) => this._tone(f, 0.3, { type: "triangle", gain: 0.1, delay: i * 0.07 })); this._metal(1568, 0.6, { delay: 0.3, gain: 0.14 }); },
    bark() { this._tone(520, 0.08, { type: "square", gain: 0.07, to: 380 }); this._tone(620, 0.08, { type: "square", gain: 0.07, to: 420, delay: 0.12 }); },
    wind() { this._noise(1.2, { filter: "bandpass", freq: 600, to: 2400, q: 0.8, gain: 0.14, attack: 0.3 }); },
    setTempo(bpm) { this._song.bpm = bpm; },
    wrong() {
      const c = this._c(); if (!c) return;
      const t0 = c.currentTime;
      const f = c.createBiquadFilter(); f.type = "lowpass"; f.Q.value = 4;
      f.frequency.setValueAtTime(1200, t0); f.frequency.exponentialRampToValueAtTime(250, t0 + 0.45);
      f.connect(this.master);
      const lfo = c.createOscillator(), lfoG = c.createGain();
      lfo.frequency.value = 7; lfoG.gain.value = 25; lfo.connect(lfoG);
      [0, 9].forEach((det) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = "sawtooth"; o.detune.value = det; lfoG.connect(o.detune);
        o.frequency.setValueAtTime(230, t0); o.frequency.exponentialRampToValueAtTime(140, t0 + 0.45);
        g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(0.12, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
        o.connect(g).connect(f); o.start(t0); o.stop(t0 + 0.52);
      });
      lfo.start(t0); lfo.stop(t0 + 0.52);
      this._tone(90, 0.25, { type: "square", gain: 0.08, to: 60 });
    },
    seat() {
      this._tone(523, 0.18, { type: "triangle", gain: 0.1 });
      this._tone(784, 0.35, { type: "triangle", gain: 0.1, delay: 0.09 });
      this._tone(1568, 0.3, { type: "sine", gain: 0.03, delay: 0.09 });
    },
    warnTick() {
      this._tone(1400, 0.035, { type: "square", gain: 0.06, to: 900 });
      this._tone(110, 0.12, { type: "sine", gain: 0.1, to: 55 });
    },
    countTick(sec) {
      const hi = sec <= 3, f = hi ? 1320 : 880;
      this._tone(f, 0.06, { type: "triangle", gain: 0.12, to: f * 0.7 });
      this._noise(0.02, { filter: "highpass", freq: 5000, gain: 0.08 });
      if (hi) this._tone(f, 0.06, { type: "triangle", gain: 0.12, to: f * 0.7, delay: 0.12 });
    },
    fanfare() {
      const notes = [392, 494, 587, 784];
      notes.forEach((f, i) => this._tone(f, 0.22, { type: "square", gain: 0.07, delay: i * 0.11 }));
      notes.forEach((f) => this._tone(f, 0.9, { type: "triangle", gain: 0.06, delay: 0.5 }));
      this._tone(98, 0.6, { type: "sine", gain: 0.12, delay: 0.5, to: 60 });
      [0, 0.09, 0.18, 0.27, 0.36].forEach((d, i) => this._metal(1047 + i * 60, 0.25, { delay: 0.55 + d, gain: 0.1 }));
    },
    fail() {
      [[311, 0], [262, 0.22], [208, 0.44]].forEach(([f, d]) => this._tone(f, 0.26, { type: "sawtooth", gain: 0.08, delay: d, to: f * 0.97 }));
      this._tone(104, 1.2, { type: "sawtooth", gain: 0.06, delay: 0.66, to: 52 });
      this._noise(0.9, { filter: "lowpass", freq: 400, to: 80, gain: 0.08, delay: 0.66 });
    },
    tap() {
      this._tone(900, 0.045, { type: "sine", gain: 0.08, to: 600 });
      this._noise(0.015, { filter: "highpass", freq: 3000, gain: 0.05 });
    },
    firework(pan = 0) {
      const c = this._c(); if (!c) return;
      let out = this.master;
      if (c.createStereoPanner) {
        const p = c.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan)); p.connect(this.master); out = p;
      }
      this._noise(0.7, { filter: "lowpass", freq: 1800, to: 120, q: 0.7, gain: 0.22, attack: 0.005, out });
      this._tone(90, 0.5, { type: "sine", gain: 0.2, to: 35, out });
      for (let i = 0; i < 6; i++) {
        this._noise(0.02, { filter: "bandpass", freq: 3000 + Math.random() * 3000, q: 3, gain: 0.04, delay: 0.25 + Math.random() * 0.6, out });
      }
    },
    _song: {
      bpm: 108,
      melody: [67, 69, 71, 74, 71, 69, 67, 0, 64, 67, 69, 71, 69, 0, 67, 0, 74, 74, 71, 74, 76, 74, 71, 69, 67, 69, 71, 69, 67, 0, 0, 0],
      bass: [43, 43, 43, 43, 40, 40, 40, 40, 38, 38, 38, 38, 43, 43, 38, 43],
    },

    _scheduleStep(step, t) {
      const c = this._c(); if (!c) return;
      const s = this._song, out = this.bgm.gain, delay = Math.max(0, t - c.currentTime);
      const eighth = 60 / s.bpm / 2;

      if (m) this._tone(this._mtof(m), eighth * 0.9, { type: "triangle", gain: 0.09, attack: 0.01, delay, out });
      if (step % 2 === 0) {
        const beat = (step / 2) % 4;
        this._tone(this._mtof(s.bass[(step / 2) % s.bass.length]), eighth * 1.6, { type: "sine", gain: 0.12, delay, out });
        if (beat === 0 || beat === 2) this._tone(70, 0.15, { type: "sine", gain: 0.2, to: 40, delay, out });
        else this._noise(0.03, { filter: "bandpass", freq: 2500, q: 2, gain: 0.05, delay, out });
      }
      if (step % s.melody.length === 0) this._metal(1200, 0.3, { gain: 0.05, delay, out });
    },
    startBgm() {
      const c = this.init(); if (!c || this.bgm.on) return;
      if (!this.bgm.gain) {
        this.bgm.gain = c.createGain(); this.bgm.gain.gain.value = 0.35;
        this.bgm.gain.connect(this.master);
      }
      this.bgm.on = true; this.bgm.step = 0; this.bgm.nextTime = c.currentTime + 0.05;
      const LOOKAHEAD = 0.12;
      const tick = () => {
        if (!this.bgm.on) return;
        const eighth = 60 / this._song.bpm / 2;   // 템포는 매 스텝 읽음(피버 타임 템포 업)
        while (this.bgm.nextTime < c.currentTime + LOOKAHEAD) {
          this._scheduleStep(this.bgm.step, this.bgm.nextTime);
          this.bgm.step = (this.bgm.step + 1) % this._song.melody.length;
          this.bgm.nextTime += eighth;
        }
      };
      tick();
      this.bgm.timer = setInterval(tick, 30);
    },
    stopBgm() { this.bgm.on = false; clearInterval(this.bgm.timer); this.bgm.timer = 0; },
  };

  const Fireworks = (() => {
    const cv = $("sky"), ctx = cv.getContext("2d");
    const COLORS = ["#ffb347", "#e8483b", "#ffe08a", "#7fd6ff", "#ff8fc7"];
    const MAX = 220, G = 70;
    const P = [];
    let W = 0, H = 0, raf = 0, last = 0, tid = 0, sound = () => false;
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      W = innerWidth; H = innerHeight;
      cv.width = W * dpr | 0; cv.height = H * dpr | 0;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function wake() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); } }
    function launch() {
      if (REDUCE || P.length > MAX - 40) return;
      const c = COLORS[Math.random() * COLORS.length | 0], x = W * (.12 + Math.random() * .76);
      P.push({ rocket: true, x, y: H * .5, vx: (Math.random() - .5) * 30, vy: -H * .9, ty: H * (.06 + Math.random() * .28), t: 0, life: 9, c });
      wake();
      if (sound()) SFX.firework(x / W * 2 - 1);
    }
    function burst(x, y, c = COLORS[Math.random() * COLORS.length | 0]) {
      if (REDUCE) return;
      const n = Math.min(26 + (Math.random() * 14 | 0), MAX - P.length);
      for (let k = 0; k < n; k++) {
        const a = (k / n) * Math.PI * 2, s = 55 + Math.random() * 70;
        P.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: .9 + Math.random() * .6, c: Math.random() < .2 ? "#fff6dc" : c });
      }
      wake();
    }
    function tick(now) {
      if (now - last < 33) { raf = requestAnimationFrame(tick); return; }
      const dt = Math.min(.05, (now - last) / 1000); last = now;
      ctx.globalCompositeOperation = "destination-out";
      ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = "lighter";
      for (let k = P.length - 1; k >= 0; k--) {
        const p = P[k];
        p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt;
        if (p.rocket) {
          p.vy *= 1 - 1.2 * dt;
          if (p.y <= p.ty || p.vy > -40) { P[k] = P[P.length - 1]; P.pop(); burst(p.x, p.y, p.c); continue; }
          ctx.globalAlpha = .9; ctx.fillStyle = p.c; ctx.fillRect(p.x - 1, p.y - 2, 2, 4);
          continue;
        }
        p.vx *= 1 - 1.6 * dt; p.vy = p.vy * (1 - 1.6 * dt) + G * dt;
        const a = 1 - p.t / p.life;
        if (a <= 0) { P[k] = P[P.length - 1]; P.pop(); continue; }
        ctx.globalAlpha = a; ctx.fillStyle = p.c; ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
      }
      ctx.globalAlpha = 1;
      if (P.length) raf = requestAnimationFrame(tick);
      else { ctx.clearRect(0, 0, W, H); raf = 0; }
    }
    let interval = [1400, 3400];
    function schedule() {
      clearTimeout(tid);
      if (REDUCE || document.hidden) return;
      tid = setTimeout(() => { launch(); schedule(); }, interval[0] + Math.random() * interval[1]);
    }
    addEventListener("resize", resize, { passive: true });
    document.addEventListener("visibilitychange", schedule);
    resize(); schedule();
    return { burst, launch, stop: () => clearTimeout(tid), start: schedule,
             setRate(a, b) { interval = [a, b]; schedule(); }, setSound(fn) { sound = fn; } };
  })();

        if (c.type === "G") {
          const p = (state.t - c.born) / c.life;
          if (p >= 1) { c.kind = null; render(i); return; }
          const bar = c.el.querySelector(".age i"); if (bar) bar.style.width = (1 - p) * 100 + "%";
        }
      }
    });

    // 콤보 감쇠: 2초간 입력 없으면 x1. 단, 걷을 돗자리가 하나도 없는 동안은 타이머를 멈춤(플레이어 잘못이 아니므로)
    if (hogs === 0) state.comboAt = state.t;
    if (state.combo > 1 && state.t - state.comboAt > 2000) { state.combo = 1; comboBreak(); }

    // ── 피버 타임: x5 를 5초 유지 → 8초간 점수 2배
    if (!state.fever && state.combo === 5 && state.c5Since && state.t - state.c5Since >= FEVER_HOLD) startFever();
    if (state.fever && state.t >= state.feverUntil) endFever();
    if (state.combo < 5) state.c5Since = 0;

    // ── 황금 돗자리: 9~17초마다 1개 (빈칸 있을 때)
    state.goldT -= dtMs;
    if (state.goldT <= 0) { state.goldT = 12000 + Math.random() * 8000; if (emptyCells().length) place("hog", null, "G"); }

    // ── 강아지: 14~22초마다 한 줄을 가로질러 달리며 빈 돗자리 짐을 하나씩 물고 감
    state.dogT -= dtMs;
    if (!state.dog && state.dogT <= 0) { state.dogT = 16000 + Math.random() * 8000; startDog(); }
    if (state.dog) runDog();

    // ── 돌풍(S2 이상): 3초 예고 후 쪽지 돗자리 1~2개가 날아가 자동 정리, 그 칸에 관람객 착석
    if (stage.n >= 2) {
      state.windT -= dtMs;
      if (!state.windAt && state.windT <= 0) { state.windAt = state.t + 3000; state.windT = 22000 + Math.random() * 10000; windWarn(); }
      if (state.windAt && state.t >= state.windAt) { state.windAt = 0; blowWind(); }
    }

    // 민원 게이지: 선점 칸 수 + 대기 인원이 올리고, 시간이 조금씩 내림. 종료 판정을 먼저 (B-2)
    if (state.anger >= 100) return end(false);
    const A = stage.anger;
    state.anger = clamp(state.anger + hogs * dt * (A.a + progress * A.b) + state.queue * .05 * dt - dt * A.c, 0, 100);
    state.maxAnger = Math.max(state.maxAnger, state.anger);

    // 위험 구간 (히스테리시스 70/65, 90/85)
    const d = state.danger;
    let nd = d;
    if (d < 2 && state.anger >= 90) nd = 2; else if (d === 2 && state.anger < 85) nd = 1;
    if (nd < 2) { if (nd < 1 && state.anger >= 70) nd = 1; else if (nd === 1 && state.anger < 65) nd = 0; }
    if (nd !== d) {
      state.danger = nd;
      if (nd === 2) { vibrate(150); $("live").textContent = "민원 곧 폭발, 90퍼센트"; }
      else if (nd === 1 && d < 1) { vibrate([60, 40, 60]); SFX.warnTick(); $("live").textContent = "민원 위험, 70퍼센트"; }
    }
    if (state.anger >= 70 && state.t - state.warnAt > 500) { state.warnAt = state.t; SFX.warnTick(); }
    const sec = Math.ceil(state.left);
    if (sec <= 10 && sec !== state.lastSec) { state.lastSec = sec; if (sec > 0) SFX.countTick(sec); }

    hud();
    if (state.anger >= 100) return end(false);
    if (state.left <= 0) return end(true);
    raf = requestAnimationFrame(loop);
  }
  function banner(text) { const b = document.createElement("div"); b.className = "banner"; b.textContent = text; $("fieldWrap").appendChild(b); setTimeout(() => b.remove(), 2400); }

  // ── 재미 요소: 피버 / 강아지 / 돌풍
  function startFever() {
    state.fever = true; state.feverUntil = state.t + FEVER_LEN; state.fevers++;
    $("feverRing").hidden = false; app.classList.add("fever");
    const t = document.createElement("span"); t.className = "fever-tag"; t.id = "feverTag"; t.textContent = "FEVER TIME x2"; $("fieldWrap").appendChild(t);
    SFX.setTempo(140); SFX.fanfare(); vibrate([30, 30, 30, 30, 60]);
    banner("피버 타임! 점수 2배");
    for (let k = 0; k < 3; k++) setTimeout(Fireworks.launch, k * 200);
  }
  function endFever() {
    state.fever = false; $("feverRing").hidden = true; app.classList.remove("fever");
    const t = $("feverTag"); if (t) t.remove();
    SFX.setTempo(108);
  }
  function cellLeft(col) { return 10 + col * (cellPx() + 8); }
  function cellPx() { return parseFloat(getComputedStyle(field).getPropertyValue("--cell")) || 78; }
  function startDog() {
    const row = Math.floor(Math.random() * stage.rows);
    const d = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    d.setAttribute("class", "dog"); d.setAttribute("aria-hidden", "true"); d.innerHTML = '<use href="#spr-dog"/>';
    d.style.top = (10 + row * (cellPx() + 8) + cellPx() * .22) + "px"; d.style.left = "-" + cellPx() + "px";
    field.appendChild(d);
    state.dog = { row, el: d, start: state.t, dur: 900 + stage.cols * 260, passed: new Set() };
    SFX.bark();
  }
  function runDog() {
    const dg = state.dog, w = field.clientWidth, cell = cellPx();
    const p = (state.t - dg.start) / dg.dur;
    const x = -cell + p * (w + cell * 1.2);
    dg.el.style.left = x + "px";
    for (let col = 0; col < stage.cols; col++) {
      const i = dg.row * stage.cols + col;
      if (dg.passed.has(i)) continue;
      if (x + cell * .5 >= cellLeft(col) + cell * .5) {
        dg.passed.add(i);
        const c = cells[i];
        if (c.kind === "hog" && !c.clearedAt && c.type !== "G") {   // 사람 있는 돗자리는 그냥 지나감
          c.taps--;
          if (c.taps > 0) { render(i); popText(i, "멍!", "info"); }
          else {
            state.score += 50 * (state.fever ? 2 : 1); state.cleared++;
            if (c.type === "D") unshade(i);
            c.kind = null; c.clearedAt = state.t; c.about = false; c.away = false; c.coming = false;
            const m = c.el.querySelector(".mat"); if (m) m.classList.add("cleared");
            c.el.querySelectorAll(".walker, .soon").forEach((e) => e.remove());
            popText(i, "+50 멍멍 정리", "good"); SFX.tap();
          }
        }
      }
    }
    if (p >= 1) { dg.el.remove(); state.dog = null; }
  }
  function windWarn() {
    const b = document.createElement("div"); b.className = "windwarn"; b.textContent = "돌풍! 3초 뒤"; $("fieldWrap").appendChild(b); setTimeout(() => b.remove(), 3000);
    SFX.wind();
  }
  function blowWind() {
    let targets = cells.map((c, i) => (c.kind === "hog" && c.type === "C" && !c.clearedAt ? i : -1)).filter((i) => i >= 0);
    if (!targets.length) targets = cells.map((c, i) => (c.kind === "hog" && c.type === "A" && !c.clearedAt ? i : -1)).filter((i) => i >= 0);
    targets.sort(() => Math.random() - .5);
    targets.slice(0, 1 + Math.floor(Math.random() * 2)).forEach((i) => {
      const c = cells[i];
      state.score += 50 * (state.fever ? 2 : 1); state.cleared++;
      c.kind = null; c.clearedAt = state.t + 350; c.about = false; c.away = false; c.coming = false;   // 날아가는 연출 0.7초 뒤 착석
      const m = c.el.querySelector(".mat"); if (m) m.classList.add("blown");
      c.el.querySelectorAll(".walker, .soon").forEach((e) => e.remove());
      popText(i, "+50 날아감!", "good");
      c.seatAfterWind = true;   // 날아간 자리에 관람객이 앉음
    });
    banner("돌풍!"); shakeScreen(2); SFX.wind();
  }

  // ── 일시정지
  function pause(auto) {
    if (phase !== "play") return;
    phase = "pause"; cancelAnimationFrame(raf); raf = 0;
    SFX.stopBgm();
    pointers.clear(); cells.forEach((c) => c.el.classList.remove("pressed", "warnpress"));
    $("pause-info").textContent = `${stage.n}스테이지 · 남은 ${Math.ceil(state.left)}초 · ${fmt(state.score)}점${auto ? " · 자동 일시정지" : ""}`;
    syncChips();
    $("pauseSheet").hidden = false;
    setTimeout(() => $("btn-resume").focus(), 50);
  }
  function resume() {
    if (phase !== "pause") return;
    $("pauseSheet").hidden = true;
    countdown(beginPlay);
  }
  $("btn-pause").addEventListener("click", () => { SFX.tap(); pause(false); });
  $("btn-resume").addEventListener("click", () => { SFX.init(); SFX.tap(); resume(); });
  $("btn-restart").addEventListener("click", () => { SFX.init(); SFX.tap(); $("pauseSheet").hidden = true; phase = "idle"; cleanupFx(); layoutStart(); countdown(beginPlay); });
  $("btn-quit").addEventListener("click", () => { SFX.tap(); $("pauseSheet").hidden = true; phase = "idle"; cleanupFx(); show("select"); });
  document.addEventListener("visibilitychange", () => { if (document.hidden) { pause(true); SFX.stopBgm(); } });
  addEventListener("popstate", () => { if (phase === "play") pause(true); });
  document.addEventListener("keydown", (e) => {
    if (e.repeat) return;
    if ((e.key === "p" || e.key === "P" || e.key === "Escape") && cur === "game") { if (phase === "play") pause(false); else if (phase === "pause") resume(); }
  });

  // ── 튜토리얼 (3단계 말풍선)
  function startTutorial() {
    phase = "tutorial";
    cells.forEach((c, i) => { c.kind = null; c.clearedAt = 0; render(i); });
    const hogI = stage.cols + 1, famI = stage.cols + 2;
    const t = state.t = 1000;
    // 같은 무늬(p5 왕골)를 둘 다 써서 "색은 힌트가 아님"을 보여줌
    const h = cells[hogI]; Object.assign(h, { kind: "hog", type: "A", taps: 1, born: 0, items: ["backpack", "icebox"], tag: "맡아둔 자리", pat: "p5", away: false }); render(hogI);
    const f = cells[famI]; Object.assign(f, { kind: "family", born: 0, life: 1e9, who: ["who-a"], pat: "p5" }); render(famI);
    tut = { step: 1, hogI, famI };
    $("tutor").hidden = false;
    tutStep();
  }
  function tutStep() {
    document.querySelectorAll(".spot").forEach((e) => e.classList.remove("spot"));
    const B = $("bubble");
    if (tut.step === 1) {
      cells[tut.hogI].el.classList.add("spot");
      B.innerHTML = `<b>사람이 없는</b> 돗자리예요(짐·쪽지만 있음). 톡 눌러서 걷어내세요! 색과 무늬는 힌트가 아니에요.<span class="step">1 / 3</span>`;
    } else if (tut.step === 2) {
      cells[tut.famI].el.classList.add("spot");
      B.innerHTML = `<b>사람이 앉아 있는</b> 자리는 건드리면 마이너스! 민원도 올라가요. 잠깐 비운 자리는 주인이 걸어오기 전에 걷으면 보너스.<button class="btn" id="btn-tut-ok" type="button">알겠어요</button><span class="step">2 / 3</span>`;
      $("btn-tut-ok").addEventListener("click", () => { SFX.tap(); tut.step = 3; tutStep(); });
    } else {
      meterRow.classList.add("spot");
      B.innerHTML = `선점 자리가 남아 있을수록 <b>민원</b>이 차요. 100%가 되면 실패!<button class="btn" id="btn-tut-go" type="button">단속 시작</button><span class="step">3 / 3</span>`;
      $("btn-tut-go").addEventListener("click", () => { SFX.tap(); endTutorial(); });
    }
  }
  function tutHit(i) {
    if (tut.step === 1 && i === tut.hogI) {
      const c = cells[i]; c.kind = null;
      const m = c.el.querySelector(".mat"); if (m) m.classList.add("cleared");
      clearFx(i); popText(i, "+100 정리!", "good"); SFX.clear(1); vibrate(15);
      state.score = 100; hud();
      setTimeout(() => { if (phase === "tutorial") { render(i); tut.step = 2; tutStep(); } }, 400);
    } else if (tut.step === 2 && i === tut.famI) {
      oopsFx(i); SFX.wrong();
    }
  }
  function endTutorial() {
    tutorialDone = true; store.set("seathog-tutorial-done", true);
    document.querySelectorAll(".spot").forEach((e) => e.classList.remove("spot"));
    $("tutor").hidden = true; tut = null;
    phase = "idle";
    showIntro();
  }
  $("btn-skip").addEventListener("click", () => { SFX.tap(); endTutorial(); });

  // ── 종료 / 결과
  function end(survived) {
    phase = "over"; state.over = true; cancelAnimationFrame(raf); raf = 0;
    if (state.fever) endFever();
    if (state.dog) { state.dog.el.remove(); state.dog = null; }
    SFX.stopBgm(); Fireworks.setRate(1400, 3400);
    pointers.clear();
    const s = state.score, cleared = survived && state.cleared >= stage.minClear;
    const stars = cleared ? (s >= stage.stars[2] ? 3 : s >= stage.stars[1] ? 2 : 1) : 0;
    const p = progress[stage.id] || { stars: 0, best: 0 };
    const isBest = s > (p.best || 0);
    p.best = Math.max(p.best || 0, s); p.stars = Math.max(p.stars || 0, stars);
    progress[stage.id] = p; store.set("seathog-progress", progress);
    if (cleared) { SFX.fanfare(); vibrate([30, 50, 30, 50, 80]); for (let k = 0; k < 4; k++) setTimeout(Fireworks.launch, k * 250); }
    else { SFX.fail(); vibrate([100, 50, 200]); }
    setTimeout(() => showResult({ survived, cleared, stars, isBest }), 500);
  }
  function showResult({ survived, cleared, stars, isBest }) {
    const s = state.score, st = stage, idx = STAGES.indexOf(st);
    const d = cleared ? st.win : st.lose;
    $("res-stage").textContent = `${st.n}스테이지 · ${st.name}`;
    const head = $("res-head");
    head.className = "res-head" + (cleared ? "" : " fail");
    head.innerHTML = `<svg class="ico"><use href="#spr-${cleared ? "fw" : "boom"}"/></svg> ${d.h}`;
    let lines = d.lines.map(([w, l]) => `<b>${w}</b> “${l}”`).join("<br>");
    if (survived && !cleared) lines = `민원은 없었지만 자리도 없었다… 최소 ${st.minClear}개를 걷어내야 해요.<br>` + lines;
    $("res-lines").innerHTML = lines;
    $("res-stars").innerHTML = [`버티기 + ${st.minClear}개 정리`, `${fmt(st.stars[1])}점`, `${fmt(st.stars[2])}점`].map((lab, k) =>
      `<div><svg class="star ${k < stars ? "on" : ""}" style="animation-delay:${k * .3}s"><use href="#spr-star"/></svg>${lab}</div>`).join("");
    $("res-score").textContent = `${fmt(s)}점`;
    $("res-best").innerHTML = isBest && s > 0 ? `<span class="badge">새 최고 기록!</span>` : `<span class="muted">최고 ${fmt(progress[st.id].best)}점</span>`;
    $("res-stats").textContent = `걷어낸 돗자리 ${state.cleared} · 오인 단속 ${state.mistakes} · 최고 콤보 x${state.maxCombo} · 피버 ${state.fevers}회 · ${survived ? `최고 민원 ${Math.round(state.maxAnger)}%` : `${Math.round(state.elapsed)}초에 폭발`}`;
    const t1 = titleFor(Math.round(s * 90 / st.sec), 1), tAll = titleFor(totalBest(), 0);
    $("res-title").innerHTML = `<small>이번 판 칭호</small><b>${t1[2]}</b><i>“${t1[3]}”</i><small style="margin-top:8px">통합 칭호 (최고점 합계 ${fmt(totalBest())}) · ${tAll[2]}</small>`;
    let tip = "";
    if (!cleared) tip = state.mistakes >= 3 ? "팁: 사람이 앉아 있으면 손 떼세요! 걸어오는 실루엣이 보이면 곧 사람 자리예요." : survived ? "팁: 2탭·3탭 돗자리는 연타로 빠르게! 황금 돗자리는 +500." : "팁: 색은 힌트가 아니에요. 사람 없는 돗자리부터 걷어요. 대기 인원이 쌓이면 민원이 빨라져요.";
    $("res-tip").textContent = tip;
    const hasNext = idx < STAGES.length - 1, nextOk = hasNext && unlocked(idx + 1);
    $("btn-next").hidden = !hasNext;
    $("btn-next").disabled = !nextOk;
    $("btn-next").textContent = nextOk ? "다음 스테이지 ▶" : "다음 스테이지 (별 1개 필요)";
    $("btn-next").className = "btn" + (cleared ? "" : " sec");
    $("btn-retry").className = "btn" + (cleared ? " sec" : "");
    if (!hasNext && cleared) { $("btn-next").hidden = false; $("btn-next").disabled = false; $("btn-next").textContent = "엔딩: 스테이지 목록"; }
    show("result");
    // 결과 화면 진입 후 500ms 입력 무시
    const btns = [$("btn-next"), $("btn-retry"), $("btn-list")]; btns.forEach((b) => b.style.pointerEvents = "none");
    setTimeout(() => { btns.forEach((b) => b.style.pointerEvents = ""); (cleared ? $("btn-next") : $("btn-retry")).focus(); }, 500);
    $("live").textContent = `${cleared ? "성공" : "실패"}, ${fmt(s)}점, 별 ${stars}개, 칭호 ${t1[2]}`;
  }
  $("btn-retry").addEventListener("click", () => { SFX.init(); SFX.tap(); startStage(STAGES.indexOf(stage)); });
  $("btn-next").addEventListener("click", () => {
    SFX.init(); SFX.tap();
    const idx = STAGES.indexOf(stage);
    if (idx >= STAGES.length - 1) show("select"); else if (unlocked(idx + 1)) startStage(idx + 1);
  });
  $("btn-list").addEventListener("click", () => { SFX.tap(); show("select"); });

  // 디버그/테스트용 읽기 전용 훅 (게임 로직에는 영향 없음)
  Object.defineProperty(window, "SEATHOG", { value: { get state() { return state; }, get cells() { return cells; }, get stage() { return stage; }, get phase() { return phase; } } });

  renderTitle();
})();
</script>
