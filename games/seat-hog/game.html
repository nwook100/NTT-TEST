<title>돗자리 단속반</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap">
<style>
/* ──────────────────────────────────────────────────────────────
   돗자리 단속반 v2
   화면: 타이틀 → 스테이지 선택 → (첫 판 튜토리얼) → 브리핑 → 3·2·1 → 인게임 → 결과
   그래픽: CSS + 인라인 SVG 스프라이트 + Canvas 불꽃 (외부 이미지 없음)
   ────────────────────────────────────────────────────────────── */
:root {
  --night: #121833;
  --grass: #1d3a2b;
  --grass-line: #27503a;
  --lantern: #ffb347;
  --lantern-red: #e8483b;
  --lantern-red-deep: #9b2a20;
  --mat-hog: #3d7bd9;
  --mat-hog-deep: #2a5cae;
  --mat-family: #d9a441;
  --mat-family-deep: #a8452f;
  --paper: #f3ecdc;
  --paper-ink: #3a2a12;
  --ink: #ece8f4;
  --muted: #9aa3c0;
  --ok: #5fd38d;
  --font-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: dark;
}
/* B-1 수정: 작성자 display 규칙이 UA [hidden]을 덮지 못하게 전역으로 고정 */
[hidden] { display: none !important; }

html { height: 100%; }
body {
  margin: 0; min-height: 100%;
  background: var(--night);
  background-image: radial-gradient(circle at 15% -10%, rgba(255,179,71,.18), transparent 40%),
                    radial-gradient(circle at 90% 0%, rgba(232,72,59,.14), transparent 35%);
  color: var(--ink);
  font-family: var(--font-body);
  padding: 12px 16px 20px;
  box-sizing: border-box;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  overflow-x: hidden;
  word-break: keep-all; /* B-7: 한글 단어 중간 줄바꿈 방지 */
}
*, *::before, *::after { box-sizing: inherit; }
button { font: inherit; color: inherit; }

#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
/* .app 에 z-index 를 주면 스택 컨텍스트가 생겨 튜토리얼 스포트라이트(.spot)가 고정 오버레이 위로 못 올라오므로 auto 로 둔다 */
.app { position: relative; max-width: 480px; margin: 0 auto; }

section[data-screen] { display: none; flex-direction: column; gap: 12px; position: relative; }
section[data-screen].on { display: flex; animation: screenIn .18s ease-out; }
@keyframes screenIn { from { opacity: 0; transform: translateY(8px); } }

/* ── 공용 ── */
.lanterns { display: flex; justify-content: space-between; height: 22px; position: relative; }
.lanterns::before { content: ""; position: absolute; left: 0; right: 0; top: 4px; border-top: 1px dashed rgba(255,179,71,.4); }
.lanterns span { width: 12px; height: 16px; margin-top: 4px; border-radius: 6px; background: var(--lantern); box-shadow: 0 0 12px var(--lantern); animation: sway 3s ease-in-out infinite; }
.lanterns span:nth-child(even) { background: var(--lantern-red); box-shadow: 0 0 12px var(--lantern-red); animation-delay: -1.5s; }
@keyframes sway { 50% { transform: rotate(8deg); } }

h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(34px, 10vw, 52px); line-height: 1; margin: 0; letter-spacing: .02em; text-align: center; }
h1 em { font-style: normal; color: var(--lantern); }
h2 { font-family: var(--font-display); font-weight: 400; margin: 0; }
.muted { color: var(--muted); }
.center { text-align: center; }
.ico { width: 1em; height: 1em; display: inline-block; vertical-align: -.15em; fill: currentColor; flex: none; }

.btn { display: block; width: 100%; max-width: 320px; margin: 0 auto; min-height: 56px; font-family: var(--font-display); font-size: 20px; padding: 10px 26px; border: 0; border-radius: 999px; background: var(--lantern-red); color: #fff; cursor: pointer; box-shadow: 0 4px 0 var(--lantern-red-deep); touch-action: manipulation; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--lantern-red-deep); }
.btn:focus-visible { outline: 3px solid var(--lantern); outline-offset: 3px; }
.btn.sec { background: rgba(255,255,255,.1); box-shadow: 0 4px 0 rgba(0,0,0,.35); min-height: 48px; font-size: 18px; }
.btn.sec:active { box-shadow: 0 1px 0 rgba(0,0,0,.35); }
.btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }
.btn-text { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 12px; min-height: 44px; cursor: pointer; font-size: 15px; }
.btn-text.danger { color: var(--lantern-red); }
.btn-text:focus-visible { outline: 3px solid var(--lantern); border-radius: 8px; }
.chips { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); cursor: pointer; font-size: 14px; touch-action: manipulation; }
.chip[aria-pressed="false"] { color: var(--muted); }
.chip .ico { width: 18px; height: 18px; }
.chip:focus-visible { outline: 3px solid var(--lantern); }

/* ── 타이틀 ── */
.hero { display: flex; gap: 14px; justify-content: center; align-items: flex-end; margin: 6px 0; }
.hero .cell { width: clamp(90px, 26vw, 120px); pointer-events: none; }
.hero .mat { animation: none; }
.hero .cell::after { content: attr(data-cap); position: absolute; left: 0; right: 0; bottom: -22px; text-align: center; font-size: 12px; color: var(--muted); }
.title-p { text-align: center; margin: 20px 0 8px; font-size: 15px; line-height: 1.6; }
.record { text-align: center; font-size: 13px; color: var(--muted); margin: 0; }

/* ── 스테이지 선택 ── */
.topbar { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; min-height: 56px; }
.topbar h2 { text-align: center; font-size: 22px; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.08); display: grid; place-items: center; cursor: pointer; touch-action: manipulation; }
.icon-btn .ico { width: 20px; height: 20px; }
.icon-btn:focus-visible { outline: 3px solid var(--lantern); }
.cards { display: flex; flex-direction: column; gap: 12px; }
.card { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; text-align: left; width: 100%; min-height: 88px; padding: 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.05); cursor: pointer; touch-action: manipulation; }
.card:focus-visible { outline: 3px solid var(--lantern); }
.card .num { font-family: var(--font-display); font-size: 30px; color: var(--lantern); text-align: center; }
.card b { display: block; font-size: 18px; }
.card small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.card .new { color: var(--ok); font-weight: bold; }
.card .stars { display: flex; gap: 2px; }
.card.locked { filter: saturate(.4); opacity: .75; }
.card.locked .num { color: var(--muted); }
.card.locked .lock { display: flex; gap: 4px; align-items: center; color: var(--muted); font-size: 13px; }
.card.deny { animation: deny .3s; }
@keyframes deny { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.star { width: 18px; height: 18px; fill: rgba(255,255,255,.18); }
.star.on { fill: var(--lantern); }

/* ── 인게임 HUD ── */
.hud { display: grid; grid-template-columns: 44px 1fr 1fr auto; gap: 8px; align-items: center; min-height: 48px; }
.hud .stat { text-align: center; }
.hud small { display: block; font-size: 11px; letter-spacing: .08em; color: var(--muted); }
.hud b { font-family: var(--font-display); font-weight: 400; font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.1; display: inline-block; }
.hud .time.low b { color: var(--lantern-red); animation: tick 1s steps(1) infinite; }
@keyframes tick { 0% { transform: scale(1.15); } 50% { transform: scale(1); } }
.combo { min-width: 60px; height: 34px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 3px; padding: 0 10px; border: 2px solid rgba(255,255,255,.2); font-family: var(--font-display); font-size: 18px; color: var(--muted); opacity: .6; transition: transform .15s; }
.combo .ico { width: 14px; height: 14px; display: none; fill: #fff; }
.combo.c2 { opacity: 1; color: #fff; background: var(--lantern); border-color: transparent; }
.combo.c2 .f1 { display: inline-block; }
.combo.c4 { opacity: 1; color: #fff; background: var(--lantern); border-color: transparent; }
.combo.c4 .f1, .combo.c4 .f2 { display: inline-block; }
.combo.c5 { opacity: 1; color: #fff; background: var(--lantern-red); border-color: transparent; box-shadow: 0 0 12px var(--lantern-red); }
.combo.c5 .f1, .combo.c5 .f2 { display: inline-block; }
.combo.bump { transform: scale(1.3); }
.combo-break { position: absolute; right: 0; top: 50px; font-size: 12px; color: var(--muted); animation: fadeUp .6s forwards; }

.meter-row { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; font-size: 12px; position: relative; min-height: 28px; }
.meter-row .lab { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.meter-row .lab .ico { width: 16px; height: 16px; }
.meter-row .lab .warn { display: none; color: var(--lantern-red); font-weight: bold; }
.meter { height: 16px; border-radius: 8px; background: rgba(255,255,255,.08); overflow: hidden; position: relative; transition: height .2s; }
.meter i { display: block; height: 100%; width: 0; background: var(--lantern); transition: width .2s; }
.meter::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 24.5%, rgba(0,0,0,.35) 24.5% 25%); pointer-events: none; }
.pct { font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; }
.queue { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); white-space: nowrap; }
.queue .ico { width: 16px; height: 16px; }
.meter-row.warn .meter { height: 20px; }
.meter-row.warn .meter i { background: var(--lantern-red); background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.25) 0 6px, transparent 6px 12px); animation: pulse 1.2s ease-in-out infinite; }
.meter-row.warn .lab .warn { display: inline; }
.meter-row.warn .pct { font-weight: bold; color: var(--lantern-red); }
.meter-row.crit .meter i { animation: pulse .6s ease-in-out infinite, slide .5s linear infinite; background-size: auto, 17px 17px; }
@keyframes pulse { 50% { filter: brightness(1.35); } }
@keyframes slide { to { background-position: 0 0, 17px 0; } }

/* ── 잔디밭 격자 ── */
.field-wrap { position: relative; }
.field {
  position: relative; margin: 0 auto;
  display: grid; grid-template-columns: repeat(var(--cols, 4), var(--cell, 78px)); gap: 8px;
  padding: 10px; border-radius: 14px; width: max-content; max-width: 100%;
  background: var(--grass);
  background-image: repeating-linear-gradient(90deg, transparent 0 18px, var(--grass-line) 18px 19px);
}
.field::after { content: ""; position: absolute; inset: 0; border-radius: 14px; pointer-events: none; opacity: 0;
  box-shadow: inset 0 0 0 2px var(--lantern-red), inset 0 0 40px 8px rgba(232,72,59,.45); }
.field.alarm::after { animation: fade .45s ease-out; }
.field.warn::after { opacity: .6; }
.field.crit::after { opacity: 1; animation: pulse .6s ease-in-out infinite; }
@keyframes fade { from { opacity: 1; } to { opacity: 0; } }
.field.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

.cell { width: var(--cell, 78px); aspect-ratio: 1 / 1; position: relative; border: 0; padding: 0; background: transparent; cursor: pointer; border-radius: 8px; touch-action: manipulation; transition: transform .08s; }
.cell.pressed { transform: scale(.94); }
.cell.pressed.warnpress::before { content: ""; position: absolute; inset: 0; border-radius: 8px; box-shadow: 0 0 0 3px var(--lantern-red); z-index: 3; pointer-events: none; }
.cell:focus-visible { outline: 3px solid var(--lantern); outline-offset: 2px; }
.cell.shade::after { content: ""; position: absolute; inset: 0; border-radius: 8px; background: rgba(10,10,30,.55); pointer-events: none; z-index: 1; }

.mat { position: absolute; inset: 6%; border-radius: 4px; display: grid; place-items: center; align-content: center; animation: drop .25s ease-out; overflow: visible; }
@keyframes drop { from { transform: scale(.6); opacity: 0; } }
/* 선점용: 파란·흰 깅엄 체크 비닐 + 광택 */
.mat.hog {
  background-color: var(--mat-hog);
  background-image:
    linear-gradient(135deg, rgba(255,255,255,.22), transparent 38%),
    linear-gradient(90deg, rgba(255,255,255,.26) 50%, transparent 0),
    linear-gradient(0deg,  rgba(255,255,255,.26) 50%, transparent 0);
  background-size: 100% 100%, 14px 14px, 14px 14px;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.16), 0 3px 0 rgba(0,0,0,.35);
  outline: 2px dashed rgba(255,255,255,.45); outline-offset: -5px;
}
/* 관람객용: 왕골 세로 짜임 + 팥색 테두리 천 */
.mat.family {
  background-color: var(--mat-family);
  background-image:
    radial-gradient(120% 80% at 20% 0%, rgba(255,214,140,.35), transparent 60%),
    repeating-linear-gradient(0deg, rgba(90,50,10,.22) 0 1px, transparent 1px 11px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.10) 0 2px, transparent 2px 5px);
  box-shadow: inset 0 0 0 3px var(--mat-family-deep), inset 0 0 0 5px rgba(0,0,0,.15), 0 3px 0 rgba(0,0,0,.35);
}
.spr { width: 44%; height: auto; aspect-ratio: 1; display: block; flex: none; }
.mat .items { display: flex; align-items: flex-end; justify-content: center; width: 100%; }
.mat .items .spr + .spr { margin-left: -8%; }
.mat.family .items .spr { width: 50%; }
.who-a { --shirt: #e8735a; --pants: #3b3f5c; --skin: #f2c7a0; --hair: #2b2233; }
.who-b { --shirt: #7c6cf0; --pants: #2e4a6b; --skin: #d9a57c; --hair: #6b3f24; }
.who-c { --shirt: #4fb3a0; --pants: #5a4a3a; --skin: #f0c8a8; --hair: #d8d8e0; }
.who-kid { transform: scale(.78); transform-origin: 50% 100%; }
.ghost { opacity: .25; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -58%); width: 50%; pointer-events: none; }

/* B-6: 쪽지를 돗자리 안쪽 상단에, 11px */
.mat .tag { position: absolute; top: 4px; left: 50%; transform: translateX(-50%) rotate(-4deg); max-width: 108%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  background: #fff3b0; color: var(--paper-ink); font-size: 11px; line-height: 1.2; padding: 2px 4px; letter-spacing: -.02em; border-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,.4);
  background-image: linear-gradient(225deg, #e6d27a 6px, transparent 6px); z-index: 1; }
.field.cols5 .mat .tag { font-size: 10px; padding: 1px 4px; }
.mat .tag.big { top: 50%; transform: translate(-50%, -50%) rotate(-6deg); font-size: 12px; padding: 6px 8px; max-width: 86%; white-space: normal; text-align: center; box-shadow: 0 2px 4px rgba(0,0,0,.45);
  background-image: linear-gradient(225deg, #e6d27a 8px, transparent 8px); animation: flutter 2s ease-in-out infinite; }
.mat .tag.big::before, .mat .tag.big::after { content: ""; position: absolute; left: 50%; top: -5px; width: 18px; height: 6px; background: rgba(255,255,255,.55); transform: translateX(-50%) rotate(28deg); }
.mat .tag.big::after { transform: translateX(-50%) rotate(-28deg); }
@keyframes flutter { 50% { transform: translate(-50%, -50%) rotate(2deg); } }
.mat.about .tag.big { animation: blinkRed .5s steps(2) infinite; }
@keyframes blinkRed { 50% { background-color: #ff8a7a; color: #fff; } }
.mat.trap .tag { font-size: 10px; background-color: var(--paper); transform: translateX(-50%) rotate(0); }

.mat .age { position: absolute; bottom: 3px; left: 4px; right: 4px; height: 3px; border-radius: 2px; background: rgba(0,0,0,.35); overflow: hidden; }
.mat .age i { display: block; height: 100%; background: var(--paper); }
.mat .taps { position: absolute; bottom: 4px; left: 0; right: 0; display: flex; justify-content: center; gap: 3px; }
.mat .taps i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.35); }
.mat .taps i.on { background: #fff; }
.pegs i { position: absolute; width: 8%; height: 8%; border-radius: 50%; background: #5b6478; box-shadow: inset 0 0 0 1.5px #cfd4df; }
.pegs i:nth-child(1) { left: 6%; bottom: 10%; } .pegs i:nth-child(2) { right: 6%; bottom: 10%; } .pegs i:nth-child(3) { left: 50%; top: 6%; margin-left: -4%; }
.pegs .spr { width: 70%; }
.pebble { position: absolute; width: 11%; height: 8%; border-radius: 50%; background: #6c6c74; box-shadow: inset -1px -1px 0 rgba(0,0,0,.4); }
.pebble.a { left: 3%; top: 3%; } .pebble.b { right: 3%; bottom: 3%; }
.cup { position: absolute; right: 8%; top: 36%; width: 14%; height: 20%; background: #f4f1e8; border-radius: 2px 2px 3px 3px; }

/* 함정 단서 */
.clue-shoes { position: absolute; right: 2%; bottom: -3%; width: 36%; z-index: 2; pointer-events: none; }
.food { position: relative; width: 44%; }
.food .spr { width: 100%; }
.food .steam { position: absolute; left: 50%; top: 4%; width: 3px; height: 3px; border-radius: 50%; background: #fff; opacity: 0; animation: steam 1.6s ease-out infinite; box-shadow: -7px 0 0 #fff, 7px 0 0 #fff; }
@keyframes steam { 0% { opacity: .9; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-50%, -14px) scale(1.6); } }
.phone { position: relative; width: 36%; }
.phone .spr { width: 100%; }
.phone .glow { position: absolute; inset: 18% 24%; border-radius: 3px; background: #bfe9ff; opacity: 0; animation: glow 2s steps(1) infinite; box-shadow: 0 0 10px 3px #bfe9ff; }
@keyframes glow { 0% { opacity: .95; } 35% { opacity: 0; } }

/* 연출: 걷어내기 */
.mat.cleared { transform-origin: 0% 100%; animation: yank .35s cubic-bezier(.5,-.4,.7,.6) forwards; }
@keyframes yank { 30% { transform: skewX(-10deg) scaleY(.9); } 100% { transform: translate(45%, -75%) rotate(-30deg) scale(.4); opacity: 0; } }
.stamp { position: absolute; left: 50%; top: 50%; z-index: 2; pointer-events: none; width: 56%; aspect-ratio: 1; display: grid; place-items: center;
  border: 3px solid var(--lantern-red); border-radius: 50%; color: var(--lantern-red); font-family: var(--font-display); font-size: clamp(13px, 4vw, 18px);
  transform: translate(-50%, -50%) rotate(-14deg); animation: stamp .5s cubic-bezier(.2,1.6,.4,1) forwards; }
@keyframes stamp { 0% { transform: translate(-50%, -50%) rotate(-14deg) scale(2); opacity: 0; } 35% { transform: translate(-50%, -50%) rotate(-14deg) scale(1); opacity: 1; } 100% { transform: translate(-50%, -50%) rotate(-14deg) scale(1); opacity: 0; } }
.spark { position: absolute; left: 50%; top: 50%; width: 6px; height: 4px; border-radius: 1px; background: var(--c); pointer-events: none; z-index: 2; animation: spark .55s ease-out forwards; }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; } }
/* 연출: 오인 단속 */
.cell.oops .mat { animation: startle .4s ease-out; }
@keyframes startle { 30% { transform: translateY(-12%) scale(1.06, .94); } 60% { transform: translateY(0) scale(.96, 1.04); } }
.cell.oops::before { content: ""; position: absolute; inset: 2px; border-radius: 8px; pointer-events: none; z-index: 3; box-shadow: 0 0 0 3px var(--lantern-red), 0 0 18px 4px rgba(232,72,59,.6); animation: fade .5s ease-out forwards; }
.anger-mark { position: absolute; right: 4%; top: 2%; width: 38%; z-index: 2; pointer-events: none; animation: angerPop .6s cubic-bezier(.2,1.8,.4,1) forwards; }
@keyframes angerPop { 0% { transform: scale(0); } 25% { transform: scale(1.15); } 80% { opacity: 1; } 100% { transform: scale(1); opacity: 0; } }

.pop { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); font-family: var(--font-display); font-size: 16px; pointer-events: none; animation: fadeUp .8s ease-out forwards; white-space: nowrap; z-index: 4; text-shadow: 0 1px 2px #000; }
.pop.good { color: var(--ok); } .pop.bad { color: var(--lantern-red); } .pop.max { font-size: 22px; } .pop.info { color: var(--paper); font-size: 13px; }
@keyframes fadeUp { to { transform: translate(-50%, -40px); opacity: 0; } }

.banner { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); padding: 10px 18px; border-radius: 12px; background: rgba(14,18,34,.85); border: 2px solid var(--lantern); color: var(--lantern); font-family: var(--font-display); font-size: 24px; white-space: nowrap; pointer-events: none; z-index: 5; animation: bannerIn 2.4s ease-out forwards; }
@keyframes bannerIn { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.8); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }

.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px; }
.legend div { display: flex; gap: 8px; align-items: center; background: rgba(255,255,255,.04); border-radius: 8px; padding: 6px 8px; }
.legend .cell { width: 40px; pointer-events: none; }
.legend .mat { animation: none; } .legend .mat .tag { display: none; } .legend .spr { width: 60%; }

/* ── 오버레이: 브리핑 / 카운트다운 / 일시정지 / 튜토리얼 ── */
.veil { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px; background: rgba(14,18,34,.78); }
.veil.dim { background: rgba(14,18,34,.72); }
.panel { width: 100%; max-width: 360px; background: #1a2140; border: 1px solid rgba(255,255,255,.12); border-radius: 18px; padding: 20px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
.panel h2 { font-size: 26px; color: var(--lantern); margin-bottom: 10px; }
.panel .line { text-align: left; margin: 6px 0; font-size: 15px; line-height: 1.5; }
.panel .line b { color: var(--lantern); font-weight: normal; }
.panel .btn { margin-top: 14px; }
.panel .btn + .btn { margin-top: 10px; }
.panel .chips { margin-top: 14px; }
.count { position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; pointer-events: none; }
.count b { font-family: var(--font-display); font-size: 96px; color: var(--lantern); text-shadow: 0 4px 20px rgba(0,0,0,.6); animation: countPop .6s ease-out; }
@keyframes countPop { from { transform: scale(1.6); opacity: 0; } }

.tutor { position: fixed; inset: 0; z-index: 30; background: rgba(14,18,34,.72); }
.spot { z-index: 35 !important; outline: 3px solid var(--lantern); outline-offset: 3px; border-radius: 10px; animation: spot 1.2s ease-in-out infinite; }
@keyframes spot { 50% { outline-color: #fff; } }
.bubble { position: absolute; left: 16px; right: 16px; bottom: 76px; margin: 0 auto; max-width: 320px; background: var(--paper); color: var(--paper-ink); border-radius: 14px; padding: 14px 16px; font-size: 16px; line-height: 1.5; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.bubble::before { content: ""; position: absolute; left: 50%; top: -10px; border: 10px solid transparent; border-top: 0; border-bottom-color: var(--paper); transform: translateX(-50%); }
.bubble .step { display: block; text-align: right; font-size: 12px; color: #7a6a52; margin-top: 6px; }
.bubble .btn { margin-top: 10px; min-height: 48px; font-size: 18px; }
.skip { position: absolute; right: 16px; bottom: 16px; }

/* ── 결과 ── */
.res-stage { text-align: center; color: var(--muted); font-size: 14px; }
.res-head { text-align: center; font-size: 30px; color: var(--lantern); }
.res-head.fail { color: var(--lantern-red); }
.res-lines { text-align: center; font-size: 15px; line-height: 1.6; margin: 0; }
.res-lines b { color: var(--lantern); font-weight: normal; }
.stars3 { display: flex; justify-content: center; gap: 18px; }
.stars3 div { text-align: center; font-size: 11px; color: var(--muted); width: 84px; }
.stars3 .star { width: 44px; height: 44px; display: block; margin: 0 auto 4px; }
.stars3 .star.on { animation: starIn .4s cubic-bezier(.2,1.6,.4,1) backwards; }
@keyframes starIn { from { transform: scale(0); } }
.res-score { text-align: center; font-family: var(--font-display); font-size: 48px; line-height: 1; }
.badge { display: inline-block; padding: 4px 12px; border-radius: 999px; background: var(--lantern); color: #1a1a1a; font-size: 13px; font-weight: bold; }
.res-stats { text-align: center; font-size: 14px; color: var(--muted); line-height: 1.7; margin: 0; }
.title-card { border: 1px solid rgba(255,179,71,.4); border-radius: 14px; padding: 12px; text-align: center; background: rgba(255,179,71,.06); }
.title-card small { color: var(--muted); display: block; font-size: 12px; }
.title-card b { font-family: var(--font-display); font-weight: 400; font-size: 22px; color: var(--lantern); }
.title-card i { display: block; font-style: normal; font-size: 13px; margin-top: 4px; }
.tip { text-align: center; font-size: 14px; color: var(--paper); margin: 0; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--paper); color: var(--paper-ink); padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); text-align: center; animation: toast 2s forwards; pointer-events: none; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 10px); } 10%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (min-width: 768px) { .hud b { font-size: 28px; } }
@media (prefers-reduced-motion: reduce) {
  .lanterns span, .mat, .spot, .meter-row .meter i, .field.shake, .hud .time.low b, .combo, .mat .tag.big, .food .steam, .phone .glow { animation: none !important; }
  section[data-screen].on { animation: none; }
  .mat.cleared { animation: fadeOut .15s forwards !important; }
  @keyframes fadeOut { to { opacity: 0; } }
  .stars3 .star.on { animation: none; }
}
</style>

<script>

  "use strict";
  const $ = (id) => document.getElementById(id);
  const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const fmt = (n) => n.toLocaleString("ko-KR");
  const spr = (id, cls = "") => `<svg class="spr ${cls}" aria-hidden="true"><use href="#spr-${id}"/></svg>`;

  // ═══════════════════════════════ 저장소 ═══════════════════════════════

  const BAG_ITEMS = ["backpack", "icebox", "parasol"];
  const PEOPLE = [["who-a"], ["who-b"], ["who-c"], ["who-a", "who-c"], ["who-b", "who-kid"]];
  // 칭호 5단계: [합계 기준, 단일 판(90초 환산) 기준, 칭호, 대사]
  const TITLES = [
    [0, 0, "형광조끼 수습생", "조끼가 아직 커 보이네요."],
    [8000, 3000, "눈치 9단 안전요원", "신발 보면 손이 멈춥니다."],
    [18000, 6000, "돗자리 접기 장인", "칼각으로 개어 드립니다."],
    [28000, 10000, "잔디밭 정의 반장", "가방은 앉을 수 없습니다."],
    [38000, 15000, "축제의 전설, 자리 반환왕", "올해 불꽃은 모두의 것."],
  ];
  const titleFor = (score, col) => { let r = TITLES[0]; for (const t of TITLES) if (score >= t[col]) r = t; return r; };

  // ═══════════════════════════════ 설정 / 진행 ═══════════════════════════════
  let settings = Object.assign({ sound: true, vibe: true }, store.get("seathog-settings", {}));
  settings.sound = !SFX.loadMute();
  let progress = store.get("seathog-progress", {});
  // 기존 seathog-best → s1.best 이관
  try { const old = +localStorage.getItem("seathog-best") || 0; if (old && !progress.s1) { progress.s1 = { stars: 0, best: old }; store.set("seathog-progress", progress); localStorage.removeItem("seathog-best"); } } catch (e) {}
  let tutorialDone = store.get("seathog-tutorial-done", false);
  const canVibe = "vibrate" in navigator;
  const vibrate = (p) => { if (!settings.vibe || !canVibe) return; try { navigator.vibrate(p); } catch (e) {} };
  const unlocked = (i) => i === 0 || ((progress[STAGES[i - 1].id] || {}).stars || 0) >= 1;
  const totalStars = () => STAGES.reduce((s, st) => s + ((progress[st.id] || {}).stars || 0), 0);
  const totalBest = () => STAGES.reduce((s, st) => s + ((progress[st.id] || {}).best || 0), 0);

  function chipsHTML() {
    return `<button class="chip" type="button" data-set="sound" aria-pressed="${settings.sound}"><svg class="ico"><use href="#spr-${settings.sound ? "sound" : "mute"}"/></svg>${settings.sound ? "소리 켬" : "소리 끔"}</button>` +
      (canVibe ? `<button class="chip" type="button" data-set="vibe" aria-pressed="${settings.vibe}"><svg class="ico"><use href="#spr-vibe"/></svg>${settings.vibe ? "진동 켬" : "진동 끔"}</button>` : "");
  }
  function syncChips() { $("chips-title").innerHTML = chipsHTML(); $("chips-pause").innerHTML = chipsHTML(); }
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-set]"); if (!b) return;
    SFX.init();
    if (b.dataset.set === "sound") { settings.sound = !settings.sound; SFX.setMuted(!settings.sound); if (settings.sound) SFX.tap(); }
    else { settings.vibe = !settings.vibe; if (settings.vibe) vibrate(30); }
    store.set("seathog-settings", settings); syncChips();
  });
  SFX.setMuted(!settings.sound);
  Fireworks.setSound(() => !!SFX.ctx && !SFX.muted && cur === "game" && phase === "play");

  function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2000); }

  // ═══════════════════════════════ 화면 전환 ═══════════════════════════════
  let cur = "title";
  function show(name) {
    cur = name;
    document.querySelectorAll("section[data-screen]").forEach((s) => s.classList.toggle("on", s.dataset.screen === name));
    window.scrollTo(0, 0);
    if (name === "title") renderTitle();
    if (name === "select") renderSelect();
    if (name === "game") fit();
  }

  // 돗자리 미니 마크업 (타이틀/범례용)
  function miniMat(kind) {
    if (kind === "hog") return `<div class="cell"><div class="mat hog"><span class="tag">곧 와요</span><span class="items">${spr("backpack")}${spr("icebox")}</span></div></div>`;
    return `<div class="cell"><div class="mat family"><span class="items">${spr("person", "who-a")}</span><span class="age"><i style="width:70%"></i></span></div></div>`;
  }
  function renderTitle() {
    $("hero").innerHTML = miniMat("hog").replace('class="cell"', 'class="cell" data-cap="걷어내기"') + miniMat("family").replace('class="cell"', 'class="cell" data-cap="그대로 두기"');
    syncChips();
    const best = totalBest(), t = titleFor(best, 0);
    $("record").textContent = best ? `최고 기록 합계 ${fmt(best)}점 · 별 ${totalStars()}/9 · ${t[2]}` : "첫 단속을 기다리는 중";
  }
  function starsHTML(n, size = "") { let h = ""; for (let k = 0; k < 3; k++) h += `<svg class="star ${k < n ? "on" : ""}" aria-hidden="true"><use href="#spr-star"/></svg>`; return h; }
  function renderSelect() {
    $("cards").innerHTML = STAGES.map((st, i) => {
      const p = progress[st.id] || {}, ok = unlocked(i), stars = p.stars || 0;
      const label = `${st.n}스테이지 ${st.name}, ${ok ? `별 3개 중 ${stars}개, ${p.best ? `최고 ${fmt(p.best)}점` : "미플레이"}` : "잠김"}`;
      return `<button class="card ${ok ? "" : "locked"}" type="button" data-i="${i}" aria-label="${label}">
        <span class="num">${ok ? st.n : `<svg class="ico"><use href="#spr-lock"/></svg>`}</span>
        <span><b>${st.name}</b><small>${st.when} · ${st.sec}초 · ${st.cols}×${st.rows}</small>
          ${ok ? `<small class="${p.best ? "" : "new"}">${p.best ? `최고 ${fmt(p.best)}점` : "NEW"}</small>` : `<small class="lock">${STAGES[i - 1].n}스테이지 별 1개 필요</small>`}</span>
        <span class="stars">${ok ? starsHTML(stars) : ""}</span></button>`;
    }).join("");
    $("sel-stars").textContent = `모은 별 ${totalStars()} / 9`;
  }
  $("cards").addEventListener("click", (e) => {
    const card = e.target.closest(".card"); if (!card) return;
    const i = +card.dataset.i;
    if (!unlocked(i)) {
      if (!REDUCE) { card.classList.remove("deny"); void card.offsetWidth; card.classList.add("deny"); }
      toast(`${STAGES[i - 1].n}스테이지에서 별 1개를 먼저 받아오세요`);
      return;
    }
    SFX.init(); SFX.tap();
    startStage(i, { tutorial: !tutorialDone && i === 0 });
  });
  $("btn-start").addEventListener("click", () => {
    SFX.init(); SFX.tap();
    // 첫 방문은 1스테이지 직행, 재방문은 스테이지 선택
    if (!tutorialDone && !progress.s1) startStage(0, { tutorial: true }); else show("select");
  });
  $("btn-sel-back").addEventListener("click", () => { SFX.tap(); show("title"); });
  $("btn-tutor-again").addEventListener("click", () => { SFX.init(); SFX.tap(); startStage(0, { tutorial: true }); });

  // ═══════════════════════════════ 인게임 ═══════════════════════════════
  const field = $("field"), meterRow = $("meterRow");
  let stage = null, state = null, cells = [], raf = 0;
  // phase: idle | tutorial | intro | count | play | pause | over
  let phase = "idle", tut = null, countTimer = 0;

  function fit() {
    if (!stage) return;
    const wrapW = $("fieldWrap").clientWidth;
    const byW = (wrapW - 20 - 8 * (stage.cols - 1)) / stage.cols;
    const top = $("fieldWrap").getBoundingClientRect().top + window.scrollY;
    const reserve = ($("legend").hidden ? 0 : 52) + 24;
    const byH = (innerHeight - top - reserve - 20 - 8 * (stage.rows - 1)) / stage.rows;
    const cell = Math.floor(clamp(Math.min(byW, byH), 48, 110));
    field.style.setProperty("--cell", cell + "px");
    field.style.setProperty("--cols", stage.cols);
    field.classList.toggle("cols5", stage.cols >= 5);
  }
  addEventListener("resize", () => { if (cur === "game") fit(); }, { passive: true });

  function buildGrid() {
    field.innerHTML = ""; cells = [];
    const N = stage.cols * stage.rows;
    for (let i = 0; i < N; i++) {
      const b = document.createElement("button");
      b.className = "cell"; b.type = "button"; b.id = "cell-" + i;
      b.dataset.i = i;
      b.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && !e.repeat) { e.preventDefault(); hit(i); } });
      field.appendChild(b);
      cells.push({ el: b, kind: null, type: null, born: 0, life: 0, taps: 0, lastTap: 0, bred: 0, shaded: false, clearedAt: 0, returnAt: 0, tag: "" });
      render(i);
    }
    $("legend").hidden = stage.n !== 1;
    $("legend").innerHTML = `<div>${miniMat("hog")}<span>쪽지·짐만 = <b>걷기</b></span></div><div>${miniMat("family")}<span>사람 있음 = <b>그대로</b></span></div>`;
    fit();
  }

  // ── 입력: pointerdown 눌림 표시 → 같은 칸에서 pointerup(이동 10px 이하)일 때 판정. 포인터 최대 2개.
  const pointers = new Map();
  field.addEventListener("pointerdown", (e) => {
    const el = e.target.closest(".cell"); if (!el) return;
    e.preventDefault();
    if (pointers.size >= 2) return;
    pointers.set(e.pointerId, { i: +el.dataset.i, x: e.clientX, y: e.clientY });
    el.classList.add("pressed");
    const c = cells[+el.dataset.i];
    if (c && (c.kind === "family" || c.kind === "trap")) el.classList.add("warnpress"); // 오인 단속 완충 표시
  });
  const release = (e, judge) => {
    const p = pointers.get(e.pointerId); if (!p) return;
    pointers.delete(e.pointerId);
    const el = cells[p.i] && cells[p.i].el; if (el) el.classList.remove("pressed", "warnpress");
    if (!judge) return;
    const tgt = document.elementFromPoint(e.clientX, e.clientY);
    const same = tgt && tgt.closest(".cell") === el;
    if (same && Math.hypot(e.clientX - p.x, e.clientY - p.y) <= 10) hit(p.i);
  };
  document.addEventListener("pointerup", (e) => release(e, true));
  document.addEventListener("pointercancel", (e) => release(e, false));

  function label(i) {
    const c = cells[i], r = Math.floor(i / stage.cols) + 1, col = (i % stage.cols) + 1;
    let s = "빈 잔디";
    if (c.kind === "hog") s = `${HOG[c.type].aria}${c.tag ? `, 쪽지: ${c.tag}` : ""}`;
    else if (c.kind === "family") s = "관람객 앉아 있음";
    else if (c.kind === "trap") s = `잠깐 자리 비운 관람객, 쪽지: ${c.tag}`;
    c.el.setAttribute("aria-label", `${r}행 ${col}열, ${s}`);
  }

  function render(i) {
    const c = cells[i];
    c.el.innerHTML = "";
    c.el.classList.remove("shade");
    if (c.shadedBy) c.el.classList.add("shade");
    label(i);
    if (!c.kind) return;
    const m = document.createElement("div");
    if (c.kind === "family") {
      m.className = "mat family";
      m.innerHTML = `<span class="items">${c.who.map((w) => spr("person", w)).join("")}</span><span class="age"><i style="width:${Math.round((1 - (state.t - c.born) / c.life) * 100)}%"></i></span>`;
    } else if (c.kind === "trap") {
      m.className = "mat hog trap";
      let inner = "";
      if (c.clues.includes("ghost")) inner += spr("person", "ghost who-b");
      if (c.clues.includes("food")) inner += `<span class="food">${spr("food")}<i class="steam"></i></span>`;
      if (c.clues.includes("phone")) inner += `<span class="phone">${spr("phone")}<i class="glow"></i></span>`;
      if (!c.clues.includes("food") && !c.clues.includes("phone")) inner += spr("backpack");
      m.innerHTML = `<span class="tag">${c.tag}</span><span class="items">${inner}</span>`;
      if (c.clues.includes("shoes")) c.el.insertAdjacentHTML("beforeend", `<svg class="spr clue-shoes" aria-hidden="true"><use href="#spr-shoes"/></svg>`);
    } else {
      m.className = "mat hog type" + c.type;
      const max = HOG[c.type].taps;
      let inner = "", extra = "";
      if (c.type === "A") inner = c.items.map((it) => spr(it)).join("");
      else if (c.type === "B") { inner = Array.from({ length: c.taps }, () => spr("chair")).join(""); extra = `<i class="pebble a"></i><i class="pebble b"></i><i class="cup"></i>`; }
      else if (c.type === "C") inner = "";
      else if (c.type === "D") { inner = `<span class="pegs">${spr("tent")}${"<i></i>".repeat(c.taps)}</span>`; }
      const tapsDots = max > 1 ? `<span class="taps">${Array.from({ length: max }, (_, k) => `<i class="${k < c.taps ? "on" : ""}"></i>`).join("")}</span>` : "";
      const tag = c.type === "C" ? `<span class="tag big">${c.tag}</span>` : (c.tag ? `<span class="tag">${c.tag}</span>` : "");
      m.innerHTML = `${tag}${extra}<span class="items">${inner}</span>${tapsDots}`;
      if (c.about) m.classList.add("about");
    }
    c.el.appendChild(m);
  }

  function popText(i, text, cls) {
    const p = document.createElement("span");
    p.className = "pop " + cls; p.textContent = text;
    cells[i].el.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }
  const SPARK_COLORS = ["#ffb347", "#e8483b", "#f3ecdc", "#ffe08a"];
  function clearFx(i) {
    const el = cells[i].el;
    const s = document.createElement("span");
    s.className = "stamp"; s.textContent = "단속";
    el.appendChild(s); setTimeout(() => s.remove(), 500);
    if (REDUCE) return;
    for (let k = 0; k < 8; k++) {
      const p = document.createElement("i");
      const a = (k / 8) * Math.PI * 2 + Math.random() * .5, d = 28 + Math.random() * 22;
      p.className = "spark";
      p.style.cssText = `--c:${SPARK_COLORS[k % 4]};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d - 10}px;--r:${Math.random() * 360}deg`;
      el.appendChild(p); setTimeout(() => p.remove(), 550);
    }
  }
  function oopsFx(i) {
    const el = cells[i].el;
    el.classList.remove("oops"); field.classList.remove("alarm", "shake");
    void el.offsetWidth;
    el.classList.add("oops"); field.classList.add("alarm");
    if (!REDUCE) field.classList.add("shake");
    el.insertAdjacentHTML("beforeend", '<svg class="spr anger-mark" aria-hidden="true"><use href="#spr-anger"/></svg>');
    const mark = el.lastElementChild;
    setTimeout(() => { mark.remove(); el.classList.remove("oops"); field.classList.remove("shake"); }, 600);
  }

  // ── 배치
  function emptyCells() { return cells.map((c, i) => (!c.kind && !c.clearedAt ? i : -1)).filter((i) => i >= 0); }
  function weighted(mix) {
    let sum = 0; for (const k in mix) sum += mix[k];
    let r = Math.random() * sum;
    for (const k in mix) { r -= mix[k]; if (r <= 0) return k; }
    return "A";
  }
  function currentMix() { return (stage.lateMix && state.elapsed >= stage.lateAt) ? stage.lateMix : stage.mix; }
  function place(kind, at, type) {
    const list = at != null ? [at] : emptyCells();
    if (!list.length) return -1;
    const i = pick(list), c = cells[i], t = state.t;
    Object.assign(c, { kind, born: t, taps: 0, lastTap: 0, bred: 0, about: false, clearedAt: 0, returnAt: 0, tag: "", items: null, who: null, clues: null });
    if (kind === "family") {
      c.life = rnd(stage.life[0], stage.life[1]);
      if (c.shadedBy) c.life *= .5;   // 텐트 그늘 아래는 체류시간 절반
      c.who = pick(PEOPLE);
    } else if (kind === "trap") {
      c.tag = pick(TRAP_TAGS);
      let pool = ["shoes", "food", "phone", "ghost"];
      if (stage.n >= 3 && Math.random() < .5) pool = pool.filter((x) => x !== "ghost");
      c.clues = []; const want = stage.clues || 3;
      while (c.clues.length < want && pool.length) { const k = pick(pool); pool = pool.filter((x) => x !== k); c.clues.push(k); }
      c.returnAt = t + rnd(4000, 7000);
    } else {
      // 유형 미지정이면 현재 믹스에서 뽑되 E(함정)는 제외 (함정은 kind="trap" 으로만 생성)
      if (!type) { const m = Object.assign({}, currentMix()); delete m.E; type = weighted(m); }
      c.type = type;
      c.taps = HOG[c.type].taps;
      if (c.type === "A") { c.items = Array.from({ length: 1 + Math.floor(Math.random() * 2) }, () => pick(BAG_ITEMS)); c.tag = Math.random() < .6 ? pick(HOG_TAGS) : ""; }
      else if (c.type === "B") c.tag = Math.random() < .5 ? pick(HOG_TAGS) : "";
      else if (c.type === "C") c.tag = "일행 와요";
      else c.tag = pick(HOG_TAGS);
    }
    render(i);
    return i;
  }
  function neighbors(i) { const r = Math.floor(i / stage.cols), c = i % stage.cols, out = []; if (r > 0) out.push(i - stage.cols); if (r < stage.rows - 1) out.push(i + stage.cols); if (c > 0) out.push(i - 1); if (c < stage.cols - 1) out.push(i + 1); return out; }
  function shade(i) {
    const c = cells[i]; c.shaded = true;
    [i - stage.cols, i + stage.cols].filter((k) => k >= 0 && k < cells.length).forEach((k) => {
      const n = cells[k]; n.shadedBy = (n.shadedBy || 0) + 1; n.el.classList.add("shade");
      if (n.kind === "family") n.life = (state.t - n.born) + ((n.born + n.life) - state.t) * .5;
    });
    state.anger = Math.min(100, state.anger + 5);
    popText(i, "시야 가림!", "bad");
  }
  function unshade(i) {
    [i - stage.cols, i + stage.cols].filter((k) => k >= 0 && k < cells.length).forEach((k) => {
      const n = cells[k]; n.shadedBy = Math.max(0, (n.shadedBy || 0) - 1); if (!n.shadedBy) n.el.classList.remove("shade");
    });
  }

  // ── 판정
  function hit(i) {
    if (phase === "tutorial") return tutHit(i);
    if (phase !== "play") return;
    const c = cells[i];
    if (!c.kind || c.clearedAt) return;
    if (state.t - c.born < 250) return;   // 등장 직후 250ms 보호
    if (c.kind === "hog") {
      c.lastTap = state.t; c.taps--;
      if (c.taps > 0) { SFX.tap(); vibrate(10); render(i); popText(i, c.type === "D" ? "팩 뽑기" : "짤깍", "info"); return; }
      const gain = HOG[c.type].score * state.combo;
      state.score += gain; state.cleared++;
      SFX.clear(state.combo); vibrate(state.combo === 5 ? [15, 30, 15] : 15);
      const was = state.combo;
      state.combo = Math.min(state.combo + 1, 5); state.comboAt = state.t; state.maxCombo = Math.max(state.maxCombo, state.combo);
      state.anger = Math.max(0, state.anger - 5);
      if (c.type === "D") unshade(i);
      c.kind = null; c.clearedAt = state.t; c.about = false;
      const m = c.el.querySelector(".mat"); if (m) m.classList.add("cleared");
      clearFx(i);
      popText(i, `+${gain} ${HOG[c.type].label}${was > 1 ? ` (x${was})` : ""}`, was === 5 ? "good max" : "good");
      if (state.combo === 5 && was < 5) { const r = c.el.getBoundingClientRect(); Fireworks.burst(r.left + r.width / 2, r.top); }
      bumpCombo();
    } else if (c.kind === "family") {
      penalty(i, 150, 15, "-150 실례!");
    } else if (c.kind === "trap") {
      penalty(i, 200, 20, "-200 사람 있어요!");
      // 주인이 돌아와 앉음(보너스 없음)
      c.kind = "family"; c.born = state.t; c.life = rnd(stage.life[0], stage.life[1]); c.who = pick(PEOPLE); render(i);
    }
    hud();
    // B-2: 오인 단속으로 100% 도달 시 즉시 종료
    if (state.anger >= 100) end(false);
  }
  function penalty(i, pts, ang, text) {
    state.score = Math.max(0, state.score - pts);
    if (state.combo > 1) comboBreak();
    state.combo = 1; state.mistakes++;
    state.anger = Math.min(100, state.anger + ang);
    SFX.wrong(); vibrate([40, 30, 40]);
    popText(i, text, "bad"); oopsFx(i);
  }
  function bumpCombo() { const b = $("combo"); b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump"); setTimeout(() => b.classList.remove("bump"), 150); }
  function comboBreak() {
    const s = document.createElement("span"); s.className = "combo-break"; s.textContent = "콤보 끊김";
    document.querySelector(".hud").style.position = "relative"; document.querySelector(".hud").appendChild(s); setTimeout(() => s.remove(), 600);
  }

  // ── HUD
  function hud() {
    const sec = Math.ceil(state.left);
    $("time").textContent = Math.max(0, sec);
    $("timeBox").classList.toggle("low", sec <= 10);
    $("score").textContent = fmt(state.score);
    $("comboN").textContent = state.combo === 5 ? "MAX" : "x" + state.combo;
    const cb = $("combo");
    cb.classList.toggle("c5", state.combo >= 5); cb.classList.toggle("c4", state.combo === 4); cb.classList.toggle("c2", state.combo >= 2 && state.combo <= 3);
    const a = Math.round(state.anger);
    $("anger").style.width = state.anger + "%";
    $("angerPct").textContent = a + "%";
    $("meter").setAttribute("aria-valuenow", a);
    $("meter").setAttribute("aria-valuetext", `민원 ${a}퍼센트${state.danger >= 2 ? ", 곧 폭발" : state.danger >= 1 ? ", 위험" : ""}`);
    $("queueN").textContent = state.queue + "명";
    $("warnTxt").textContent = state.danger >= 2 ? "곧 폭발!" : "위험";
    meterRow.classList.toggle("warn", state.danger >= 1); meterRow.classList.toggle("crit", state.danger >= 2);
    field.classList.toggle("warn", state.danger === 1); field.classList.toggle("crit", state.danger >= 2);
  }

  // ── 스테이지 시작 흐름
  function newState() {
    return { score: 0, combo: 1, comboAt: 0, maxCombo: 1, anger: 0, maxAnger: 0, queue: 0, cleared: 0, mistakes: 0,
             left: stage.sec, elapsed: 0, t: 0, last: 0, spawnT: .6, queueT: 2, danger: 0, warnAt: 0, lastSec: 99, encoreDone: false, finaleDone: false, over: false };
  }
  function startStage(i, opt = {}) {
    stage = STAGES[i]; state = newState(); phase = "idle";
    cancelAnimationFrame(raf); raf = 0;
    buildGrid(); hud();
    show("game");
    try { history.pushState({ seathog: 1 }, ""); } catch (e) {}
    if (opt.tutorial) startTutorial(); else showIntro();
  }
  function showIntro() {
    phase = "intro";
    $("intro-stage").textContent = `${stage.n}스테이지 · ${stage.name}`;
    $("intro-h").textContent = stage.intro.h;
    $("intro-lines").innerHTML = stage.intro.lines.map(([w, l]) => `<p class="line"><b>${w}</b> “${l}”</p>`).join("");
    $("intro").hidden = false;
    setTimeout(() => $("btn-go").focus(), 50);
  }
  $("btn-go").addEventListener("click", () => { if (phase !== "intro") return; SFX.init(); SFX.tap(); $("intro").hidden = true; layoutStart(); countdown(beginPlay); });
  function layoutStart() {
    cells.forEach((c, i) => { c.kind = null; c.clearedAt = 0; c.shadedBy = 0; render(i); });
    state = newState();
    for (let k = 0; k < stage.start[0]; k++) place("hog", null, k === 0 ? "A" : undefined);
    for (let k = 0; k < stage.start[1]; k++) place("family");
    hud();
  }
  function countdown(done) {
    phase = "count"; let n = 3;
    $("count").hidden = false; $("countN").textContent = n;
    clearInterval(countTimer);
    countTimer = setInterval(() => {
      n--;
      if (n <= 0) { clearInterval(countTimer); $("count").hidden = true; done(); return; }
      const b = $("countN"); b.textContent = n; b.style.animation = "none"; void b.offsetWidth; b.style.animation = "";
    }, 600);
  }
  function beginPlay() {
    phase = "play"; state.last = performance.now();
    SFX.startBgm();
    cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
  }

  // ── 메인 루프 (게임 시계 state.t 는 일시정지 중 멈춤)
  function loop(now) {
    if (phase !== "play") return;
    const dtMs = Math.min(100, now - state.last); state.last = now;
    const dt = dtMs / 1000;
    state.t += dtMs; state.left -= dt; state.elapsed += dt;
    const progress = clamp(1 - state.left / stage.sec, 0, 1);

    // 이벤트: S2 앵콜(40초 시점 3초간 관람객 스폰 x2), S3 피날레(남은 30초)
    let spawnMul = 1, famBoost = 1;
    if (stage.encoreAt != null && state.elapsed >= stage.encoreAt && state.elapsed < stage.encoreAt + 3) {
      spawnMul = .5; famBoost = 2;
      if (!state.encoreDone) { state.encoreDone = true; banner("무대 앵콜!"); }
    }
    let queueRate = 2;
    if (stage.finaleLast != null && state.left <= stage.finaleLast) {
      queueRate = 1;
      if (!state.finaleDone) { state.finaleDone = true; banner("불꽃 시작!"); Fireworks.setRate(500, 900); for (let k = 0; k < 3; k++) setTimeout(Fireworks.launch, k * 300); }
    }

    // 스폰
    state.spawnT -= dt;
    if (state.spawnT <= 0) {
      state.spawnT = lerp(stage.spawn[0], stage.spawn[1], progress) * spawnMul;
      const hogRatio = lerp(stage.hog[0], stage.hog[1], progress) / famBoost;
      if (Math.random() < hogRatio) {
        const type = weighted(currentMix());
        place(type === "E" ? "trap" : "hog", null, type === "E" ? undefined : type);
      } else place("family");
    }
    // 대기 관람객 증가
    state.queueT -= dt;
    if (state.queueT <= 0) { state.queueT = queueRate; state.queue = Math.min(state.queue + 1, 30); }

    // 칸 상태 갱신
    let hogs = 0;
    cells.forEach((c, i) => {
      if (c.clearedAt) {
        if (state.t - c.clearedAt >= 350) { c.clearedAt = 0; if (state.queue > 0) { state.queue--; place("family", i); SFX.seat(); } else render(i); }
        return;
      }
      if (c.kind === "family") {
        const p = (state.t - c.born) / c.life;
        if (p >= 1) { c.kind = null; render(i); return; }
        const bar = c.el.querySelector(".age i"); if (bar) bar.style.width = (1 - p) * 100 + "%";
      } else if (c.kind === "hog") {
        hogs++;
        const max = HOG[c.type].taps;
        if (c.taps < max && state.t - c.lastTap > 3000) { c.taps = max; render(i); }   // 다탭 진행도 3초 뒤 초기화
        if (c.type === "C") {
          const age = state.t - c.born;
          if (age >= 10000 && c.bred < 2) {
            const empties = neighbors(i).filter((k) => !cells[k].kind && !cells[k].clearedAt);
            if (empties.length) { place("hog", pick(empties), "A"); popText(i, "번식!", "bad"); }
            c.bred++; c.born = state.t; c.about = false; render(i);
          } else if (age >= 8000 && c.bred < 2 && !c.about) { c.about = true; render(i); }
        } else if (c.type === "D" && !c.shaded && state.t - c.born >= 8000) shade(i);
      } else if (c.kind === "trap") {
        if (state.t >= c.returnAt) {
          c.kind = "family"; c.born = state.t; c.life = rnd(stage.life[0], stage.life[1]); c.who = pick(PEOPLE); render(i);
          state.score += 50; popText(i, "+50 눈치 보너스", "good"); SFX.seat();
        }
      }
    });

    // 콤보 감쇠: 2초간 성공 없으면 x1
    if (state.combo > 1 && state.t - state.comboAt > 2000) { state.combo = 1; comboBreak(); }

    // 민원 게이지: 선점 칸 수 + 대기 인원이 올리고, 시간이 조금씩 내림. 종료 판정을 먼저 (B-2)
    if (state.anger >= 100) return end(false);
    const A = stage.anger;
    state.anger = clamp(state.anger + hogs * dt * (A.a + progress * A.b) + state.queue * .05 * dt - dt * A.c, 0, 100);
    state.maxAnger = Math.max(state.maxAnger, state.anger);

    // 위험 구간 (히스테리시스 70/65, 90/85)
    const d = state.danger;
    let nd = d;
    if (d < 2 && state.anger >= 90) nd = 2; else if (d === 2 && state.anger < 85) nd = 1;
    if (nd < 2) { if (nd < 1 && state.anger >= 70) nd = 1; else if (nd === 1 && state.anger < 65) nd = 0; }
    if (nd !== d) {
      state.danger = nd;
      if (nd === 2) { vibrate(150); $("live").textContent = "민원 곧 폭발, 90퍼센트"; }
      else if (nd === 1 && d < 1) { vibrate([60, 40, 60]); SFX.warnTick(); $("live").textContent = "민원 위험, 70퍼센트"; }
    }
    if (state.anger >= 70 && state.t - state.warnAt > 500) { state.warnAt = state.t; SFX.warnTick(); }
    const sec = Math.ceil(state.left);
    if (sec <= 10 && sec !== state.lastSec) { state.lastSec = sec; if (sec > 0) SFX.countTick(sec); }

    hud();
    if (state.anger >= 100) return end(false);
    if (state.left <= 0) return end(true);
    raf = requestAnimationFrame(loop);
  }
  function banner(text) { const b = document.createElement("div"); b.className = "banner"; b.textContent = text; $("fieldWrap").appendChild(b); setTimeout(() => b.remove(), 2400); }

  // ── 일시정지
  function pause(auto) {
    if (phase !== "play") return;
    phase = "pause"; cancelAnimationFrame(raf); raf = 0;
    SFX.stopBgm();
    pointers.clear(); cells.forEach((c) => c.el.classList.remove("pressed", "warnpress"));
    $("pause-info").textContent = `${stage.n}스테이지 · 남은 ${Math.ceil(state.left)}초 · ${fmt(state.score)}점${auto ? " · 자동 일시정지" : ""}`;
    syncChips();
    $("pauseSheet").hidden = false;
    setTimeout(() => $("btn-resume").focus(), 50);
  }
  function resume() {
    if (phase !== "pause") return;
    $("pauseSheet").hidden = true;
    countdown(beginPlay);
  }
  $("btn-pause").addEventListener("click", () => { SFX.tap(); pause(false); });
  $("btn-resume").addEventListener("click", () => { SFX.init(); SFX.tap(); resume(); });
  $("btn-restart").addEventListener("click", () => { SFX.init(); SFX.tap(); $("pauseSheet").hidden = true; phase = "idle"; layoutStart(); countdown(beginPlay); });
  $("btn-quit").addEventListener("click", () => { SFX.tap(); $("pauseSheet").hidden = true; phase = "idle"; show("select"); });
  document.addEventListener("visibilitychange", () => { if (document.hidden) { pause(true); SFX.stopBgm(); } });
  addEventListener("popstate", () => { if (phase === "play") pause(true); });
  document.addEventListener("keydown", (e) => {
    if (e.repeat) return;
    if ((e.key === "p" || e.key === "P" || e.key === "Escape") && cur === "game") { if (phase === "play") pause(false); else if (phase === "pause") resume(); }
  });

  // ── 튜토리얼 (3단계 말풍선)
  function startTutorial() {
    phase = "tutorial";
    cells.forEach((c, i) => { c.kind = null; c.clearedAt = 0; render(i); });
    const hogI = stage.cols + 1, famI = stage.cols + 2;
    const t = state.t = 1000;
    const h = cells[hogI]; Object.assign(h, { kind: "hog", type: "A", taps: 1, born: 0, items: ["backpack", "icebox"], tag: "맡아둔 자리" }); render(hogI);
    const f = cells[famI]; Object.assign(f, { kind: "family", born: 0, life: 1e9, who: ["who-a"] }); render(famI);
    tut = { step: 1, hogI, famI };
    $("tutor").hidden = false;
    tutStep();
  }
  function tutStep() {
    document.querySelectorAll(".spot").forEach((e) => e.classList.remove("spot"));
    const B = $("bubble");
    if (tut.step === 1) {
      cells[tut.hogI].el.classList.add("spot");
      B.innerHTML = `<b>쪽지만 붙고 사람이 없는</b> 돗자리예요. 톡 눌러서 걷어내세요!<span class="step">1 / 3</span>`;
    } else if (tut.step === 2) {
      cells[tut.famI].el.classList.add("spot");
      B.innerHTML = `<b>사람이 앉아 있는</b> 자리는 건드리면 안 돼요. 민원이 올라가요.<button class="btn" id="btn-tut-ok" type="button">알겠어요</button><span class="step">2 / 3</span>`;
      $("btn-tut-ok").addEventListener("click", () => { SFX.tap(); tut.step = 3; tutStep(); });
    } else {
      meterRow.classList.add("spot");
      B.innerHTML = `선점 자리가 남아 있을수록 <b>민원</b>이 차요. 100%가 되면 실패!<button class="btn" id="btn-tut-go" type="button">단속 시작</button><span class="step">3 / 3</span>`;
      $("btn-tut-go").addEventListener("click", () => { SFX.tap(); endTutorial(); });
    }
  }
  function tutHit(i) {
    if (tut.step === 1 && i === tut.hogI) {
      const c = cells[i]; c.kind = null;
      const m = c.el.querySelector(".mat"); if (m) m.classList.add("cleared");
      clearFx(i); popText(i, "+100 정리!", "good"); SFX.clear(1); vibrate(15);
      state.score = 100; hud();
      setTimeout(() => { if (phase === "tutorial") { render(i); tut.step = 2; tutStep(); } }, 400);
    } else if (tut.step === 2 && i === tut.famI) {
      oopsFx(i); SFX.wrong();
    }
  }
  function endTutorial() {
    tutorialDone = true; store.set("seathog-tutorial-done", true);
    document.querySelectorAll(".spot").forEach((e) => e.classList.remove("spot"));
    $("tutor").hidden = true; tut = null;
    phase = "idle";
    showIntro();
  }
  $("btn-skip").addEventListener("click", () => { SFX.tap(); endTutorial(); });

  // ── 종료 / 결과
  function end(survived) {
    phase = "over"; state.over = true; cancelAnimationFrame(raf); raf = 0;
    SFX.stopBgm(); Fireworks.setRate(1400, 3400);
    pointers.clear();
    const s = state.score, cleared = survived && state.cleared >= stage.minClear;
    const stars = cleared ? (s >= stage.stars[2] ? 3 : s >= stage.stars[1] ? 2 : 1) : 0;
    const p = progress[stage.id] || { stars: 0, best: 0 };
    const isBest = s > (p.best || 0);
    p.best = Math.max(p.best || 0, s); p.stars = Math.max(p.stars || 0, stars);
    progress[stage.id] = p; store.set("seathog-progress", progress);
    if (cleared) { SFX.fanfare(); vibrate([30, 50, 30, 50, 80]); for (let k = 0; k < 4; k++) setTimeout(Fireworks.launch, k * 250); }
    else { SFX.fail(); vibrate([100, 50, 200]); }
    setTimeout(() => showResult({ survived, cleared, stars, isBest }), 500);
  }
  function showResult({ survived, cleared, stars, isBest }) {
    const s = state.score, st = stage, idx = STAGES.indexOf(st);
    const d = cleared ? st.win : st.lose;
    $("res-stage").textContent = `${st.n}스테이지 · ${st.name}`;
    const head = $("res-head");
    head.className = "res-head" + (cleared ? "" : " fail");
    head.innerHTML = `<svg class="ico"><use href="#spr-${cleared ? "fw" : "boom"}"/></svg> ${d.h}`;
    let lines = d.lines.map(([w, l]) => `<b>${w}</b> “${l}”`).join("<br>");
    if (survived && !cleared) lines = `민원은 없었지만 자리도 없었다… 최소 ${st.minClear}개를 걷어내야 해요.<br>` + lines;
    $("res-lines").innerHTML = lines;
    $("res-stars").innerHTML = [`버티기 + ${st.minClear}개 정리`, `${fmt(st.stars[1])}점`, `${fmt(st.stars[2])}점`].map((lab, k) =>
      `<div><svg class="star ${k < stars ? "on" : ""}" style="animation-delay:${k * .3}s"><use href="#spr-star"/></svg>${lab}</div>`).join("");
    $("res-score").textContent = `${fmt(s)}점`;
    $("res-best").innerHTML = isBest && s > 0 ? `<span class="badge">새 최고 기록!</span>` : `<span class="muted">최고 ${fmt(progress[st.id].best)}점</span>`;
    $("res-stats").textContent = `걷어낸 돗자리 ${state.cleared} · 오인 단속 ${state.mistakes} · 최고 콤보 x${state.maxCombo} · ${survived ? `최고 민원 ${Math.round(state.maxAnger)}%` : `${Math.round(state.elapsed)}초에 폭발`}`;
    const t1 = titleFor(Math.round(s * 90 / st.sec), 1), tAll = titleFor(totalBest(), 0);
    $("res-title").innerHTML = `<small>이번 판 칭호</small><b>${t1[2]}</b><i>“${t1[3]}”</i><small style="margin-top:8px">통합 칭호 (최고점 합계 ${fmt(totalBest())}) · ${tAll[2]}</small>`;
    let tip = "";
    if (!cleared) tip = state.mistakes >= 3 ? "팁: 신발·떡볶이·사람이 보이면 손을 떼세요!" : survived ? "팁: 2탭·3탭 돗자리는 연타로 빠르게!" : "팁: 쪽지 붙은 돗자리부터 걷어요. 대기 인원이 쌓이면 민원이 빨라져요.";
    $("res-tip").textContent = tip;
    const hasNext = idx < STAGES.length - 1, nextOk = hasNext && unlocked(idx + 1);
    $("btn-next").hidden = !hasNext;
    $("btn-next").disabled = !nextOk;
    $("btn-next").textContent = nextOk ? "다음 스테이지 ▶" : "다음 스테이지 (별 1개 필요)";
    $("btn-next").className = "btn" + (cleared ? "" : " sec");
    $("btn-retry").className = "btn" + (cleared ? " sec" : "");
    if (!hasNext && cleared) { $("btn-next").hidden = false; $("btn-next").disabled = false; $("btn-next").textContent = "엔딩: 스테이지 목록"; }
    show("result");
    // 결과 화면 진입 후 500ms 입력 무시
    const btns = [$("btn-next"), $("btn-retry"), $("btn-list")]; btns.forEach((b) => b.style.pointerEvents = "none");
    setTimeout(() => { btns.forEach((b) => b.style.pointerEvents = ""); (cleared ? $("btn-next") : $("btn-retry")).focus(); }, 500);
    $("live").textContent = `${cleared ? "성공" : "실패"}, ${fmt(s)}점, 별 ${stars}개, 칭호 ${t1[2]}`;
  }
  $("btn-retry").addEventListener("click", () => { SFX.init(); SFX.tap(); startStage(STAGES.indexOf(stage)); });
  $("btn-next").addEventListener("click", () => {
    SFX.init(); SFX.tap();
    const idx = STAGES.indexOf(stage);
    if (idx >= STAGES.length - 1) show("select"); else if (unlocked(idx + 1)) startStage(idx + 1);
  });
  $("btn-list").addEventListener("click", () => { SFX.tap(); show("select"); });

  // 디버그/테스트용 읽기 전용 훅 (게임 로직에는 영향 없음)
  Object.defineProperty(window, "SEATHOG", { value: { get state() { return state; }, get cells() { return cells; }, get stage() { return stage; }, get phase() { return phase; } } });

  renderTitle();
})();
</script>
