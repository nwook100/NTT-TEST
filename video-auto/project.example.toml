# vauto 프로젝트 설정 예시.  촬영 폴더에 project.toml 로 복사해서 고쳐 쓰세요.
# 적지 않은 항목은 기본값이 적용됩니다.

[project]
name = "2026-11 전시회"
# 로컬 LLM 에게 주는 편집 지시문. 영상의 목적, 분위기, 뺄 것과 살릴 것을 평소 말로 적습니다.
brief = """
반도체 전시회 방문 영상. 제품 설명 위주로 남기고, 말을 다시 한 부분과 잡담은 뺀다.
제목은 검색에 잘 걸리게, 설명은 정중한 말투로.
"""
languages = ["ko", "en", "ja"]   # 만들 자막 언어
source_language = "auto"         # 한 언어로만 말했다면 "ko" 처럼 지정하면 더 정확합니다

[edit]
cut_silence = true    # 말 사이 침묵 자르기
merge_gap = 0.6       # 이 초보다 짧은 쉼은 그대로 둠 (값을 키우면 컷이 줄어듦)
broll_max = 5.0       # 말이 없는 클립에서 쓸 길이(초). 0 = 전체
target_sec = 0        # 본편 목표 길이(초). 0 = NG 컷만 제거
use_llm = true

[short]
enabled = true
max_sec = 60          # 쇼츠·릴스용 하이라이트 길이

[whisper]
# 자주 나오는 제품명·전문용어를 적어 두면 인식이 좋아집니다.
vocabulary = "웨이퍼 카세트, 매거진, 링, 핀 보트, wafer cassette, magazine, ring, pin boat"

[llm]
model = "qwen3.8:27b"                     # ollama list 에 보이는 이름
base_url = "http://localhost:11434/v1"

# 번역할 때 반드시 이렇게 옮길 용어
[glossary]
"핀 보트" = { en = "pin boat", ja = "ピンボート" }
"매거진" = { en = "magazine", ja = "マガジン" }

[color]
auto = true
strength = 0.6        # 0 = 보정 없음, 1 = 강하게
saturation = 1.0      # 1.1 = 채도 10% 올림
input_lut = ""        # Log 로 찍은 원본이면 Rec.709 변환 LUT(.cube) 경로
look_lut = ""         # 분위기를 입히는 LUT(.cube) 경로

[fcp]
subtitle_mode = "captions"   # captions = 언어별로 켜고 끄는 캡션 / titles = 화면에 박힌 자막 / none

# 대상별 설정. burn 은 화면에 태워 넣을 자막 언어. ["ko","en","ja"] 면 언어별 파일 3개가 나옵니다.
[targets.youtube]
burn = []                    # 유튜브는 자막 파일(subs/*.srt)을 따로 올리는 것을 권장

[targets.reels]
burn = ["ko", "en", "ja"]

[targets.x]
max_sec = 140                # 유료(프리미엄) 계정이면 늘려도 됩니다
