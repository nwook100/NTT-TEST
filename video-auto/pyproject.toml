[project]
name = "vauto"
version = "0.1.0"
description = "촬영 원본 폴더 → 자막·컷편집·색보정·Final Cut 프로젝트·SNS용 파일 자동 생성"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "faster-whisper>=1.0; sys_platform != 'darwin'",
]

[project.scripts]
vauto = "vauto.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vauto"]
